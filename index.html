<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CAGED Trainer</title>
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --canvas:#f5f5f7;
  --surface:#ffffff;
  --surface-sunken:#f2f2f5;
  --ink:#1d1d1f;
  --ink-2:#6e6e73;
  --ink-3:#a1a1a6;
  --hairline:rgba(0,0,0,.09);
  --hairline-soft:rgba(0,0,0,.05);
  --accent:#0071e3;
  --accent-ink:#0071e3;
  --accent-wash:rgba(0,113,227,.10);
  --red:#d70015;
  --shadow-1:0 1px 2px rgba(0,0,0,.05);
  --shadow-2:0 1px 2px rgba(0,0,0,.04),0 12px 32px -16px rgba(0,0,0,.28);
  --r-lg:22px;
  --r-md:14px;
  --r-sm:10px;
  --ease:cubic-bezier(.32,.72,0,1);
}
body.mode-perform{
  --accent:#5e5ce6;
  --accent-ink:#4f4dd6;
  --accent-wash:rgba(94,92,230,.10);
}
@media (prefers-color-scheme:dark){
  :root{
    --canvas:#000000;
    --surface:#1c1c1e;
    --surface-sunken:#2c2c2e;
    --ink:#f5f5f7;
    --ink-2:#98989d;
    --ink-3:#6e6e73;
    --hairline:rgba(255,255,255,.12);
    --hairline-soft:rgba(255,255,255,.07);
    --accent:#0a84ff;
    --accent-ink:#4ea6ff;
    --accent-wash:rgba(10,132,255,.16);
    --red:#ff453a;
    --shadow-1:none;
    --shadow-2:none;
  }
  body.mode-perform{
    --accent:#7d7aff;
    --accent-ink:#a5a3ff;
    --accent-wash:rgba(125,122,255,.18);
  }
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-wash);outline-offset:2px;border-radius:8px}

.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 56px}

/* ============================================================
   Masthead + segmented control
   ============================================================ */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.masthead h1{font-size:30px;font-weight:600;letter-spacing:-.022em}
.masthead p{color:var(--ink-2);font-size:15px;margin-top:3px}

.seg{position:relative;display:flex;background:var(--surface-sunken);border-radius:12px;padding:3px;min-width:264px}
.seg__thumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:var(--surface);border-radius:9px;box-shadow:var(--shadow-1);transition:transform .32s var(--ease);pointer-events:none}
body.mode-perform .seg__thumb{transform:translateX(100%)}
.seg button{position:relative;flex:1;border:0;background:none;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;border-radius:9px;transition:color .2s}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:600}

/* ============================================================
   Cards
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:var(--r-lg);box-shadow:var(--shadow-2)}
.card__title{font-size:13px;font-weight:600;letter-spacing:-.005em;color:var(--ink-2);padding:16px 18px 10px}

.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px}

/* ============================================================
   Stage
   ============================================================ */
.stage{display:flex;flex-direction:column;min-height:498px;overflow:hidden}
.stage__bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-sunken);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);opacity:.4;transition:opacity .06s linear,transform .06s linear,background-color .06s linear}
.dot.beat{opacity:1;transform:scale(1.45);background:var(--accent)}
.dot.beat.accent{transform:scale(1.9)}

.timer{font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.rail{height:2px;background:var(--hairline-soft)}
.rail__fill{height:100%;width:0;background:var(--accent);transition:width .4s linear}

/* Prompt */
.prompt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:34px 30px;transition:opacity .3s ease}
.prompt__eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.prompt__title{font-size:52px;font-weight:600;letter-spacing:-.035em;line-height:1.02}
.prompt__lede{font-size:17px;color:var(--ink-2);max-width:42ch}
.prompt.is-idle .prompt__title{font-size:34px;letter-spacing:-.028em}
.prompt.is-paused{opacity:.42}
.prompt__head{animation:enter .34s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Detail cards */
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--hairline-soft);border:1px solid var(--hairline-soft);border-radius:var(--r-md);overflow:hidden}
.detail{background:var(--surface);padding:12px 14px}
.detail dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.detail dd{margin:0;font-size:19px;font-weight:500;letter-spacing:-.015em}
.detail dd .sub{color:var(--ink-3);font-weight:400}

/* Progression rail (signature element) */
.prog{display:grid;gap:14px}
.prog__chords{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chord{display:inline-flex;flex-direction:column;align-items:center;min-width:70px;padding:7px 14px 6px;border-radius:12px;background:var(--surface-sunken);color:var(--ink-2);transition:background-color .28s var(--ease),color .28s var(--ease),transform .28s var(--ease)}
.chord b{font-size:19px;font-weight:500;letter-spacing:-.015em}
.chord i{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.07em;opacity:.6;margin-top:1px}
.chord.is-active{background:var(--accent);color:#fff;transform:scale(1.04)}
.prog__beats{display:flex;gap:10px}
.measure{display:flex;gap:4px;flex:1}
.tick{flex:1;height:4px;border-radius:2px;background:var(--hairline);transition:background-color .1s linear}
.tick.on{background:var(--accent)}
.tick.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}

/* Fretboard */
.fb{width:100%;max-width:400px;height:auto;display:block}
.fb-str,.fb-fret{stroke:var(--hairline);stroke-width:1}
.fb-nut{stroke:var(--ink-3);stroke-width:2.5;stroke-linecap:round}
.fb-inlay{fill:var(--ink-3);opacity:.22}
.fb-num{fill:var(--ink-3);font-size:10px;font-weight:600;text-anchor:middle}
.fb-open{fill:var(--ink-3);font-size:10px;font-weight:600;text-anchor:middle}
.fb-dot{fill:var(--surface);stroke:var(--hairline);stroke-width:1}
.fb-dot.on{fill:var(--accent);stroke:none}
.fb-ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.55}
.fb-txt{font-size:9.5px;font-weight:600;text-anchor:middle;dominant-baseline:central;fill:var(--ink-3)}
.fb-txt.on{fill:#fff}
.fb-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.fb-legend span{display:inline-flex;align-items:center;gap:5px}
.fb-key{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.fb-key.dim{background:var(--surface-sunken);border:1px solid var(--hairline)}

/* Constraint */
.constraint{border:1px solid var(--hairline);border-radius:var(--r-md);padding:14px 16px;background:var(--accent-wash)}
.constraint dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:3px}
.constraint dd{margin:0;font-size:20px;font-weight:500;letter-spacing:-.018em}

/* Transport */
.transport{display:flex;gap:8px;flex-wrap:wrap;padding:16px 18px;border-top:1px solid var(--hairline-soft)}
.btn{border:1px solid transparent;border-radius:999px;padding:9px 17px;font-size:14.5px;font-weight:500;cursor:pointer;background:var(--surface-sunken);color:var(--ink);transition:transform .12s var(--ease),opacity .2s,background-color .2s}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.97)}
.btn--primary{background:var(--accent);color:#fff}
.btn--quiet{background:transparent;color:var(--ink-2)}
.btn--danger{background:transparent;color:var(--red)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.transport .spacer{flex:1}

/* ============================================================
   Settings
   ============================================================ */
.settings{padding:6px 18px 18px}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hairline-soft)}
.field:last-child{border-bottom:0}
.field > label{font-size:14.5px;font-weight:450}
.field .hint{display:block;font-size:12.5px;color:var(--ink-3)}
select,input[type="number"]{
  appearance:none;-webkit-appearance:none;
  border:1px solid var(--hairline);border-radius:var(--r-sm);
  background:var(--surface-sunken);color:var(--ink);
  padding:7px 10px;font:inherit;font-size:14.5px;text-align:right;
  max-width:200px;
}
select{padding-right:28px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23a1a1a6' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
input[type="number"]{width:76px;font-variant-numeric:tabular-nums}

.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface-sunken);border:1px solid var(--hairline);transition:background-color .28s var(--ease)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .28s var(--ease)}
.switch input:checked + span{background:var(--accent);border-color:transparent}
.switch input:checked + span::after{transform:translateX(20px)}

input[type="range"]{-webkit-appearance:none;appearance:none;width:132px;background:none}
input[type="range"]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--hairline)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28)}
input[type="range"]::-moz-range-track{height:4px;border-radius:2px;background:var(--hairline)}
input[type="range"]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.slider{display:flex;align-items:center;gap:10px}
.slider output{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;width:38px;text-align:right}
[hidden]{display:none !important}

/* ============================================================
   Lists
   ============================================================ */
.list{padding:0 8px 8px}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 10px;border-radius:var(--r-sm);font-size:14.5px;overflow:hidden}
.row + .row{box-shadow:inset 0 1px 0 var(--hairline-soft)}
.row span:last-child{color:var(--ink-2);font-size:13.5px;text-align:right}
.row.is-active{background:var(--accent-wash);box-shadow:none}
.row.is-active + .row{box-shadow:none}
.row.is-active span:first-child{color:var(--accent-ink);font-weight:600}
.row__fill{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent);transition:width .5s linear}
.row.is-done span:first-child{color:var(--ink-3)}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .stage{min-height:0}
}
@media (max-width:560px){
  .wrap{padding:20px 14px 40px}
  .masthead{align-items:flex-start}
  .seg{width:100%}
  .prompt{padding:26px 20px}
  .prompt__title{font-size:40px}
  .prompt.is-idle .prompt__title{font-size:27px}
  .timer{font-size:22px}
  .transport{padding:14px}
  .btn{flex:1;text-align:center}
  .transport .spacer{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body class="mode-train">
<main class="wrap">

  <header class="masthead">
    <div>
      <h1>CAGED Trainer</h1>
      <p>Train automatically. Perform with constraints.</p>
    </div>
    <div class="seg" role="tablist" aria-label="Mode">
      <div class="seg__thumb" aria-hidden="true"></div>
      <button id="trainTab" role="tab" aria-selected="true">Train</button>
      <button id="performTab" role="tab" aria-selected="false">Perform</button>
    </div>
  </header>

  <div class="layout">

    <!-- ---------------- Stage ---------------- -->
    <section class="card stage col">
      <div class="stage__bar">
        <div class="chips">
          <span class="chip" id="keyChip">Key A</span>
          <span class="chip" id="positionChip">1st position</span>
          <span class="chip"><i class="dot" id="beatDot"></i><span id="bpmChip">80 BPM</span></span>
        </div>
        <div class="timer" id="timer" aria-live="off">10:00</div>
      </div>
      <div class="rail"><div class="rail__fill" id="railFill"></div></div>

      <div class="prompt is-idle" id="prompt">
        <div class="prompt__head" id="promptHead">
          <p class="prompt__eyebrow" id="eyebrow">Train</p>
          <h2 class="prompt__title" id="title">Ready when you are</h2>
        </div>
        <p class="prompt__lede" id="lede">Start the session and the metronome, prompts and section changes run on their own.</p>
        <div id="detailSlot"></div>
        <div id="diagramSlot"></div>
        <div id="constraintSlot"></div>
      </div>

      <div class="transport">
        <button class="btn btn--primary" id="startBtn">Start train</button>
        <button class="btn" id="pauseBtn" disabled>Pause</button>
        <button class="btn" id="skipBtn" disabled>Skip section</button>
        <button class="btn btn--quiet" id="metroBtn">Metronome</button>
        <span class="spacer"></span>
        <button class="btn btn--quiet" id="completeBtn">Log session</button>
        <button class="btn btn--danger" id="stopBtn" disabled>Stop</button>
      </div>
    </section>

    <!-- ---------------- Side ---------------- -->
    <div class="col">

      <section class="card">
        <h3 class="card__title">Session</h3>
        <div class="settings">
          <div class="field">
            <label for="keySelect">Key</label>
            <select id="keySelect"></select>
          </div>
          <div class="field">
            <label for="positionSelect">Position<span class="hint" id="shapeHint"></span></label>
            <select id="positionSelect"></select>
          </div>
          <div class="field">
            <label for="diagramMode">Fretboard</label>
            <select id="diagramMode">
              <option value="full">Full pattern</option>
              <option value="roots">Roots only</option>
              <option value="off">Off</option>
            </select>
          </div>
          <div class="field" id="labelField">
            <label for="labelMode">Dot labels</label>
            <select id="labelMode">
              <option value="interval">Intervals</option>
              <option value="note">Note names</option>
            </select>
          </div>
          <div class="field" id="trainBpmField">
            <label for="trainBpm">Tempo<span class="hint">train &middot; beats per minute</span></label>
            <input id="trainBpm" type="number" min="40" max="140" step="1" value="60">
          </div>
          <div class="field" id="performBpmField" hidden>
            <label for="bpmInput">Tempo<span class="hint">perform &middot; beats per minute</span></label>
            <input id="bpmInput" type="number" min="40" max="220" step="1" value="80">
          </div>
          <div class="field" id="trainMinutesField">
            <label for="trainMinutes">Train length<span class="hint">minutes</span></label>
            <input id="trainMinutes" type="number" min="3" max="20" value="10">
          </div>
          <div class="field" id="performMinutesField" hidden>
            <label for="performMinutes">Perform length<span class="hint">minutes</span></label>
            <input id="performMinutes" type="number" min="1" max="15" value="5">
          </div>
        </div>
      </section>

      <section class="card" id="mixCard" hidden>
        <h3 class="card__title">Sound</h3>
        <div class="settings">
          <div class="field">
            <label for="backingToggle">Backing chords</label>
            <span class="switch"><input type="checkbox" id="backingToggle" checked><span></span></span>
          </div>
          <div class="field">
            <label for="metroVolume">Metronome</label>
            <span class="slider"><input type="range" id="metroVolume" min="0" max="100" value="75"><output id="metroVolumeOut">75%</output></span>
          </div>
          <div class="field">
            <label for="backingVolume">Backing</label>
            <span class="slider"><input type="range" id="backingVolume" min="0" max="100" value="45"><output id="backingVolumeOut">45%</output></span>
          </div>
        </div>
      </section>

      <section class="card">
        <h3 class="card__title" id="flowTitle">Session flow</h3>
        <div class="list" id="flowList"></div>
      </section>

      <section class="card">
        <h3 class="card__title">Position rotation</h3>
        <div class="list" id="rotationList"></div>
      </section>

      <section class="card">
        <h3 class="card__title">Progress</h3>
        <div class="list" id="progressList"></div>
      </section>

    </div>
  </div>
</main>

<script>
"use strict";

/* ============================================================
   1. Music model
   ============================================================ */
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const PITCH  = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

const KEYS = ['A','Bb','B','C','C#','D','D#','E','F','F#','G','G#'];
const SCALE = {major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10]};
const QUALITY = {major:['','m','m','','','m','dim'], minor:['m','dim','','m','m','','']};

const POSITIONS = [
  {name:'1st position', major:'E shape', minor:'Dm shape'},
  {name:'2nd position', major:'D shape', minor:'Cm shape'},
  {name:'3rd position', major:'C shape', minor:'Am shape'},
  {name:'4th position', major:'A shape', minor:'Gm shape'},
  {name:'5th position', major:'G shape', minor:'Em shape'}
];

/* degree → CAGED shape for each position */
const DEGREE_SHAPES = {
  '1st position':[['1','E'],['2','Gm (A)'],['3','Am (C)'],['4','A'],['5','C'],['6','Dm (E)']],
  '2nd position':[['1','D'],['2','Em (G)'],['3','Gm (A)'],['4','G'],['5','A'],['6','Cm (D)']],
  '3rd position':[['1','C'],['2','Dm (E)'],['3','Em (G)'],['4','E'],['5','G'],['6','Am (C)']],
  '4th position':[['1','A'],['2','Cm (D)'],['3','Dm (E)'],['4','D'],['5','E'],['6','Gm (A)']],
  '5th position':[['1','G'],['2','Am (C)'],['3','Cm (D)'],['4','C'],['5','D'],['6','Em (G)']]
};

/* name, share of the session, bars each prompt is held for */
const TRAIN_BLOCKS = [
  ['Note recall', 60,  4],
  ['Chord shape', 90,  4],
  ['Arpeggio',    120, 4],
  ['Full scale',  180, 4],
  ['Pentatonic',  90,  4]
];

const CONSTRAINTS = [
  'Full arpeggio',
  'Triad — root, 3rd / ♭3rd and 5th',
  'Target the root',
  'Target the 3rd / ♭3rd',
  'Target the 5th',
  'Hit all chord tones at least once',
  'Use the full major / minor scale',
  'Use only the major / minor pentatonic scale',
  'Bottom (high) 2 strings only',
  'Middle 2 strings only',
  'Top (low) 2 strings only'
];

const PROGRESSIONS = [
  {name:'Pop rock',        mode:'major', degrees:['1','5','6','4']},
  {name:'Classic rock',    mode:'major', degrees:['1','4','5']},
  {name:'50s rock',        mode:'major', degrees:['1','6','4','5']},
  {name:'Folk rock',       mode:'major', degrees:['1','5','4']},
  {name:'Rock anthem',     mode:'major', degrees:['6','4','1','5']},
  {name:'Alternative minor',mode:'minor',degrees:['1','6','3','7']},
  {name:'Dark rock',       mode:'minor', degrees:['1','7','6','7']},
  {name:'Minor rock',      mode:'minor', degrees:['1','4','7']},
  {name:'Cinematic minor', mode:'minor', degrees:['1','6','7']},
  {name:'Modal rock',      mode:'minor', degrees:['1','3','7','6']}
];

const BEATS_PER_CHORD = 16;   // four bars of 4/4
const BEATS_PER_BAR = 4;
const ROTATION = 6;           // degrees 1-6 in a position

/* Both spellings, because the learner needs to recognise either */
const CHROMATIC = ['C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭','A','A♯/B♭','B'];
const ROMAN = ['I','ii','iii','IV','V','vi','vii°'];

/* A minor-flavoured progression is the same key heard from its sixth degree,
   so every chord stays diatonic to the major key just practised. */
const minorDegreeToMajor = d => ((Number(d) - 1 + 5) % 7) + 1;
const progressionDegrees = p =>
  p.mode === 'major' ? p.degrees.map(Number) : p.degrees.map(minorDegreeToMajor);

/* Spell accidentals the way the key is actually read, not always as sharps */
const FLAT_MAJOR = new Set(['F','Bb','Eb','Ab','Db','Gb']);
const FLAT_MINOR = new Set(['D','G','C','F','Bb','Eb','Ab','Db']);
const prefersFlats = (key, mode) => key.includes('b') || (mode === 'minor' ? FLAT_MINOR : FLAT_MAJOR).has(key);
const noteName = (pc, flats) => (flats ? FLATS : SHARPS)[((pc % 12) + 12) % 12];

function chordName(key, mode, degree){
  const i = Number(degree) - 1;
  return noteName(PITCH[key] + SCALE[mode][i], prefersFlats(key, mode)) + QUALITY[mode][i];
}
function chordMidi(key, mode, degree, octave = 3){
  const i = Number(degree) - 1, steps = SCALE[mode], base = 12 * (octave + 1) + PITCH[key];
  const at = n => base + steps[n % 7] + (n >= 7 ? 12 : 0);
  const root = base + steps[i];
  return [root, at(i + 2), at(i + 4), root + 12];
}

const rand = a => a[Math.floor(Math.random() * a.length)];
const clock = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2,'0');
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th','st','nd','rd'][n % 10] || 'th');
const shapeHtml = label => String(label).replace(/\s*\(([^)]+)\)/, ' <span class="sub">($1)</span>');

/* ---- Fretboard geometry -------------------------------------------------
   A position is a five-fret window whose start is a fixed interval above the
   tonic's fret on the low E string. Everything in the diagram is then derived
   from the key and that window, so there are no fingering tables to maintain. */
const STRING_PC = [4, 11, 7, 2, 9, 4];          // high E down to low E
const POSITION_OFFSET = [0, 2, 4, 7, 9];        // 1st .. 5th position
const FRET_SPAN = 4;                            // start .. start + 4
const FRET_PAD = 1;                             // empty frets drawn for context
const INTERVAL = ['1','\u266d2','2','\u266d3','3','4','\u266d5','5','\u266d6','6','\u266d7','7'];
const INLAYS = [3,5,7,9,15,17,19,21];

function positionWindow(keyName, posIndex){
  const tonicFret = ((PITCH[keyName] - STRING_PC[5]) % 12 + 12) % 12;
  const start = (tonicFret + POSITION_OFFSET[posIndex]) % 12;
  return {start, end:start + FRET_SPAN};
}
/* Pitch classes for the whole key, one degree's chord tones, or its pentatonic */
function pitchSet(keyName, degree, kind){
  const base = PITCH[keyName], i = Number(degree) - 1;
  const at = n => (base + SCALE.major[((n % 7) + 7) % 7]) % 12;
  if(kind === 'chord') return [0,2,4].map(k => at(i + k));
  if(kind === 'pent'){
    const isMinor = [2,3,6].includes(Number(degree));
    return (isMinor ? [0,2,3,4,6] : [0,1,2,4,5]).map(k => at(i + k));
  }
  return SCALE.major.map((_, n) => at(n));
}

/* Storage that degrades gracefully in sandboxed frames */
const store = (() => {
  const mem = {};
  const ok = (() => { try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; } })();
  return {
    get:(k,d) => { try { return (ok ? localStorage.getItem(k) : mem[k]) ?? d; } catch(e){ return d; } },
    set:(k,v) => { try { ok ? localStorage.setItem(k,v) : (mem[k] = String(v)); } catch(e){} }
  };
})();

/* ============================================================
   2. Audio engine — one context, three buses, sample-accurate clock
   ============================================================ */
const Audio = (() => {
  let ctx = null, metroBus = null, backingBus = null, cueBus = null, pad = [];

  function build(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    metroBus = ctx.createGain();   metroBus.gain.value = .75;
    backingBus = ctx.createGain(); backingBus.gain.value = .45;
    cueBus = ctx.createGain();     cueBus.gain.value = .9;
    [metroBus, backingBus, cueBus].forEach(b => b.connect(ctx.destination));
  }
  /* Synchronous on purpose. iOS only honours resume() inside the tap that
     triggered it, so this must never sit behind an await. */
  function ensure(){
    if(!ctx) build();
    if(ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  const suspended = () => !!ctx && ctx.state !== 'running';
  const now = () => ctx ? ctx.currentTime : 0;
  const setGain = (bus, v) => { if(ctx) bus.gain.setTargetAtTime(v, ctx.currentTime, .02); };

  function env(node, t, peak, attack, decay){
    node.gain.setValueAtTime(.0001, t);
    node.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t + attack);
    node.gain.exponentialRampToValueAtTime(.0001, t + decay);
  }

  function click(accent, t){
    if(!ctx) return;
    const g = ctx.createGain();
    g.connect(metroBus);
    if(accent){
      const o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = 1050;
      env(g, t, .16, .004, .09);
      o.connect(g); o.start(t); o.stop(t + .1);
    } else {
      const len = Math.floor(ctx.sampleRate * .028);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
      const src = ctx.createBufferSource(), hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 1500;
      g.gain.setValueAtTime(.11, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .035);
      src.buffer = buf; src.connect(hp); hp.connect(g); src.start(t);
    }
  }

  function cue(t = now()){                    // new prompt
    if(!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(1150, t);
    o.frequency.exponentialRampToValueAtTime(1500, t + .12);
    env(g, t, .10, .01, .38);
    o.connect(g); g.connect(cueBus); o.start(t); o.stop(t + .42);
  }

  function bell(t = now()){                   // new section
    if(!ctx) return;
    [660, 880, 1100].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f;
      env(g, t, .14 / (i + 1), .01, 1.2);
      o.connect(g); g.connect(cueBus); o.start(t); o.stop(t + 1.25);
    });
  }

  function stopPad(t = now(), release = .3){
    pad.forEach(({osc, gain}) => {
      try {
        gain.gain.cancelScheduledValues(t);
        gain.gain.setValueAtTime(Math.max(gain.gain.value, .0001), t);
        gain.gain.exponentialRampToValueAtTime(.0001, t + release);
        osc.stop(t + release + .05);
      } catch(e){}
    });
    pad = [];
  }

  function playPad(midis, t = now()){
    if(!ctx) return;
    stopPad(t, .18);
    midis.forEach((m, i) => {
      const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      lp.type = 'lowpass'; lp.frequency.value = 1500;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(i === 0 ? .16 : .11, t + .12);
      o.connect(lp); lp.connect(g); g.connect(backingBus);
      o.start(t); pad.push({osc:o, gain:g});
    });
  }

  return {
    ensure, suspended, now, click, cue, bell, playPad, stopPad,
    metro:v => setGain(metroBus, v),
    backing:v => setGain(backingBus, v)
  };
})();

/* ============================================================
   3. State
   ============================================================ */
const $ = id => document.getElementById(id);

const session = {
  mode:'train', running:false, paused:false,
  total:600, startedAt:0, pausedFor:0, pauseStart:0, skew:0,
  plan:null, sectionIndex:-1, itemIndex:-1
};
const metro = { on:false, timer:null, nextBeat:0, beat:0, queue:[] };
const perform = { progression:null, degrees:[], chordIndex:0, constraint:'', beatInChord:0, pending:false };
const train = { sectionIndex:0, itemIndex:0, beatInItem:0, newSection:false, force:false };

const clamp = (v, lo, hi, d) => Math.min(hi, Math.max(lo, Number(v) || d));
const bpm = () => session.mode === 'train'
  ? clamp($('trainBpm').value, 40, 140, 60)
  : clamp($('bpmInput').value, 40, 220, 80);
const position = () => POSITIONS[Number($('positionSelect').value)];
const positionShapes = () => DEGREE_SHAPES[position().name];
const key = () => $('keySelect').value;

/* ============================================================
   3b. Screen wake lock — stop the phone locking mid-session
   ============================================================ */
const Wake = (() => {
  let lock = null;
  const ok = 'wakeLock' in navigator;
  async function acquire(){
    if(!ok || lock) return;
    try {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } catch(e){ lock = null; }
  }
  function release(){
    if(!lock) return;
    try { lock.release(); } catch(e){}
    lock = null;
  }
  /* The lock is dropped whenever the page is hidden, so take it again on return */
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') sync();
  });
  function sync(){ (session.running && !session.paused) || metro.on ? acquire() : release(); }
  return {sync, supported:ok};
})();

/* ============================================================
   4. Metronome — lookahead scheduler (no setInterval drift)
   ============================================================ */
const LOOKAHEAD = .12, TICK_MS = 25;

function schedule(){
  while(metro.nextBeat < Audio.now() + LOOKAHEAD){
    const t = metro.nextBeat;
    const accent = metro.beat % BEATS_PER_BAR === 0;
    let event = null;

    if(session.running && !session.paused){
      if(session.mode === 'perform' && perform.progression){
        if(perform.pending || perform.beatInChord >= BEATS_PER_CHORD){
          if(!perform.pending) advanceChord();
          perform.pending = false;
          perform.beatInChord = 0;
          Audio.playPad(chordMidi(key(), 'major', currentDegree()), t);
          Audio.cue(t);
          event = {kind:'chord'};
        }
        perform.beatInChord++;
      } else if(session.mode === 'train' && session.plan){
        const sec = session.plan.sections[train.sectionIndex];
        const last = session.plan.sections.length - 1;
        if(train.force || train.beatInItem >= sec.beatsPerItem){
          let hold = false;
          if(!train.force){
            train.itemIndex++;
            if(train.itemIndex >= sec.items){
              if(train.sectionIndex < last){
                train.sectionIndex++; train.itemIndex = 0; train.newSection = true;
              } else { train.itemIndex = sec.items - 1; hold = true; }
            }
          }
          train.force = false;
          train.beatInItem = 0;
          if(!hold){
            train.newSection ? Audio.bell(t) : Audio.cue(t);
            event = {kind:'item', section:train.sectionIndex, item:train.itemIndex, newSection:train.newSection};
            train.newSection = false;
          }
        }
        train.beatInItem++;
      }
    }

    Audio.click(accent, t);
    metro.queue.push({t, accent, event, beatInChord:perform.beatInChord});
    metro.beat++;
    metro.nextBeat += 60 / bpm();
  }
}

function startMetro(){
  stopMetro();
  Audio.ensure();                       // synchronous, inside the tap
  metro.on = true;
  metro.beat = 0;
  metro.nextBeat = Audio.now() + .08;
  metro.timer = setInterval(schedule, TICK_MS);
  schedule();
  $('metroBtn').textContent = 'Stop metronome';
  Wake.sync();
}
function stopMetro(){
  clearInterval(metro.timer);
  metro.timer = null; metro.on = false; metro.queue.length = 0;
  $('beatDot').className = 'dot';
  $('metroBtn').textContent = 'Metronome';
  Wake.sync();
}

/* ============================================================
   5. Prompts
   ============================================================ */
function setPrompt({eyebrow, title, lede = '', details = null, idle = false}){
  $('eyebrow').textContent = eyebrow;
  $('title').textContent = title;
  $('lede').textContent = lede;
  $('lede').hidden = !lede;
  $('prompt').classList.toggle('is-idle', idle);
  $('diagramSlot').innerHTML = '';
  $('detailSlot').innerHTML = details
    ? '<dl class="details">' + details.map(([k, v]) =>
        `<div class="detail"><dt>${k}</dt><dd>${v}</dd></div>`).join('') + '</dl>'
    : '';
  const head = $('promptHead');                       // replay the entrance
  head.style.animation = 'none'; void head.offsetWidth; head.style.animation = '';
}

/* Draws all twelve chromatic notes before repeating any, and remembers where
   it got to between sessions. Independent of key and position. */
const noteBag = (() => {
  let order = [], i = 0;
  function shuffle(avoidFirst){
    order = CHROMATIC.map((_, n) => n);
    for(let j = order.length - 1; j > 0; j--){
      const k = Math.floor(Math.random() * (j + 1));
      [order[j], order[k]] = [order[k], order[j]];
    }
    if(avoidFirst !== undefined && order[0] === avoidFirst) [order[0], order[1]] = [order[1], order[0]];
    i = 0;
  }
  try {
    const saved = JSON.parse(store.get('cagedNoteBag', 'null'));
    if(saved && Array.isArray(saved.order) && saved.order.length === CHROMATIC.length){
      order = saved.order; i = Math.min(saved.i | 0, order.length);
    } else shuffle();
  } catch(e){ shuffle(); }
  return {
    next(){
      if(i >= order.length) shuffle(order[order.length - 1]);
      const pitch = order[i++];
      store.set('cagedNoteBag', JSON.stringify({order, i}));
      return {name:CHROMATIC[pitch], step:i};
    }
  };
})();

/* One draw per item, so a re-render doesn't burn a note */
let noteFor = (() => {
  let stamp = '', held = null;
  return (s, i) => {
    const id = s + ':' + i;
    if(id !== stamp){ stamp = id; held = noteBag.next(); }
    return held;
  };
})();

function trainPrompt(sectionIndex, itemIndex){
  const k = key();
  const section = session.plan.sections[sectionIndex][0];
  const [degree, shapeLabel] = positionShapes()[itemIndex % positionShapes().length];
  const shape = shapeHtml(shapeLabel);
  const chord = chordName(k, 'major', degree);
  const isMinor = chord.endsWith('m');
  const root = chord.replace('m','');
  const place = [['CAGED shape', shape], ['Position', ordinal(Number($('positionSelect').value) + 1)], ['Degree', ordinal(Number(degree))]];

  if(section === 'Note recall'){
    const n = noteFor(sectionIndex, itemIndex);
    return setPrompt({
      eyebrow:section,
      title:n.name,
      lede:`Find every ${n.name} on the neck, nut to twelfth fret.`,
      details:[['Note', n.step + ' of ' + CHROMATIC.length]]
    });
  }
  const pos = Number($('positionSelect').value);
  const rootPc = pitchSet(k, degree, 'chord')[0];
  const kind = section === 'Full scale' ? 'scale' : section === 'Pentatonic' ? 'pent' : 'chord';
  const draw = () => { $('diagramSlot').innerHTML = fretboard(k, pos, rootPc, pitchSet(k, degree, kind)); };

  if(section === 'Chord shape'){
    setPrompt({eyebrow:section, title:chord, details:[['Play','Chord'], ...place]});
  } else if(section === 'Arpeggio'){
    setPrompt({eyebrow:section, title:chord, details:[['Play','Arpeggio'], ...place]});
  } else if(section === 'Full scale'){
    setPrompt({eyebrow:section, title:`${root} ${isMinor ? 'minor' : 'major'}`, details:[['Play','Full scale'], ...place]});
  } else {
    setPrompt({eyebrow:section, title:`${root} ${isMinor ? 'minor' : 'major'}`, details:[['Play','Pentatonic'], ...place]});
  }
  draw();
}

const currentDegree = () => perform.degrees[perform.chordIndex];

function advanceChord(){
  perform.chordIndex = (perform.chordIndex + 1) % perform.degrees.length;
  perform.constraint = rand(CONSTRAINTS);
}

function performPrompt(){
  const k = key(), p = perform.progression;
  setPrompt({
    eyebrow:`${p.name} · key of ${k}`,
    title:chordName(k, 'major', currentDegree())
  });
  $('detailSlot').innerHTML =
    '<div class="prog"><div class="prog__chords">' +
    perform.degrees.map((d, i) =>
      `<span class="chord${i === perform.chordIndex ? ' is-active' : ''}"><b>${chordName(k, 'major', d)}</b><i>${ROMAN[d - 1]}</i></span>`
    ).join('') +
    '</div><div class="prog__beats" id="beatRail">' +
    Array.from({length:BEATS_PER_CHORD / BEATS_PER_BAR}, () =>
      '<span class="measure">' + '<i class="tick"></i>'.repeat(BEATS_PER_BAR) + '</span>'
    ).join('') +
    '</div></div>';
  $('diagramSlot').innerHTML =
    fretboard(k, Number($('positionSelect').value),
              pitchSet(k, currentDegree(), 'chord')[0],
              pitchSet(k, currentDegree(), 'chord'));
  $('constraintSlot').innerHTML =
    `<dl class="constraint"><dt>Constraint</dt><dd>${perform.constraint}</dd></dl>`;
}

/* ---- Fretboard renderer ------------------------------------------------- */
const diagramMode = () => $('diagramMode').value;
const labelMode = () => $('labelMode').value;

function fretboard(keyName, posIndex, rootPc, emphasise){
  if(diagramMode() === 'off') return '';
  const roots = diagramMode() === 'roots';
  const win = positionWindow(keyName, posIndex);
  const first = Math.max(0, win.start - FRET_PAD), last = win.end + FRET_PAD;
  const cols = last - first + 1;
  const cw = 46, rh = 26, gx = 20, gy = 20;
  const W = gx + cols * cw + 8, H = gy + 5 * rh + 32;
  const x = f => gx + (f - first) * cw + cw / 2;
  const edge = f => gx + (f - first) * cw;
  const y = st => gy + st * rh;

  const shown = new Set(roots ? [rootPc] : pitchSet(keyName, 1, 'scale'));
  const strong = new Set(roots ? [rootPc] : emphasise);
  const flats = prefersFlats(keyName, 'major');
  const parts = [];

  for(let st = 0; st < 6; st++)
    parts.push(`<line class="fb-str" x1="${gx}" y1="${y(st)}" x2="${gx + cols * cw}" y2="${y(st)}"/>`);
  for(let f = first; f <= last + 1; f++){
    const nut = f === 0;
    parts.push(`<line class="${nut ? 'fb-nut' : 'fb-fret'}" x1="${edge(f)}" y1="${y(0)}" x2="${edge(f)}" y2="${y(5)}"/>`);
  }
  INLAYS.filter(f => f >= first && f <= last)
    .forEach(f => parts.push(`<circle class="fb-inlay" cx="${x(f)}" cy="${(y(0) + y(5)) / 2}" r="3.5"/>`));
  if(12 >= first && 12 <= last)
    [1.6, 3.4].forEach(k => parts.push(`<circle class="fb-inlay" cx="${x(12)}" cy="${y(0) + k * rh}" r="3.5"/>`));

  for(let st = 0; st < 6; st++){
    for(let f = win.start; f <= win.end; f++){
      const pc = (STRING_PC[st] + f) % 12;
      if(!shown.has(pc)) continue;
      const iv = (pc - rootPc + 12) % 12;
      const on = strong.has(pc);
      const text = labelMode() === 'note' ? noteName(pc, flats) : INTERVAL[iv];
      if(iv === 0) parts.push(`<circle class="fb-ring" cx="${x(f)}" cy="${y(st)}" r="14"/>`);
      parts.push(`<circle class="fb-dot${on ? ' on' : ''}" cx="${x(f)}" cy="${y(st)}" r="11"/>`);
      parts.push(`<text class="fb-txt${on ? ' on' : ''}" x="${x(f)}" y="${y(st)}">${text}</text>`);
    }
  }
  for(let f = first; f <= last; f++)
    parts.push(`<text class="fb-num" x="${x(f)}" y="${y(5) + 22}">${f === 0 ? 'open' : f}</text>`);

  const legend = roots ? '' :
    `<div class="fb-legend"><span><i class="fb-key"></i>In the pattern</span>` +
    `<span><i class="fb-key dim"></i>Rest of the key</span>` +
    `<span>Ringed dot = root</span></div>`;
  return `<svg class="fb" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" ` +
    `aria-label="Fretboard, frets ${first} to ${last}">${parts.join('')}</svg>${legend}`;
}

function paintBeatRail(beatInChord){
  const ticks = document.querySelectorAll('#beatRail .tick');
  ticks.forEach((tick, i) => {
    tick.classList.toggle('on', i < beatInChord);
    tick.classList.toggle('now', i === beatInChord - 1);
  });
}

/* ============================================================
   6. Session loop
   ============================================================ */
/* Every prompt is held for the same number of bars, so each chord in the
   rotation gets identical time. Sections are then rounded to a whole number of
   prompts — and to whole rotations where they're long enough — so nothing gets
   cut off mid-chord. The session length is snapped to match. */
function buildPlan(totalSeconds){
  const beat = 60 / bpm();
  const base = TRAIN_BLOCKS.reduce((sum, b) => sum + b[1], 0);
  let acc = 0;
  const sections = TRAIN_BLOCKS.map(b => {
    const beatsPerItem = b[2] * BEATS_PER_BAR;
    const itemSeconds = beatsPerItem * beat;
    const wanted = b[1] / base * totalSeconds;
    let items = Math.max(1, Math.round(wanted / itemSeconds));
    if(b[0] !== 'Note recall' && items >= ROTATION) items = Math.round(items / ROTATION) * ROTATION;
    const length = items * itemSeconds;
    acc += length;
    return {name:b[0], items, beatsPerItem, itemSeconds, length, end:acc};
  });
  return {sections, total:acc};
}

function elapsed(){
  if(!session.running) return 0;
  const paused = session.paused ? performance.now() - session.pauseStart : 0;
  return (performance.now() - session.startedAt - session.pausedFor - paused) / 1000 + session.skew;
}

function frame(){
  requestAnimationFrame(frame);

  /* If the OS suspended the audio clock — screen lock, a call, an app switch —
     pick up from now rather than firing every missed beat at once. */
  if(metro.on){
    if(Audio.suspended()) Audio.ensure();
    if(metro.nextBeat < Audio.now() - .4){
      metro.nextBeat = Audio.now() + .08;
      metro.beat = 0;
      metro.queue.length = 0;
      if(session.running){
        if(session.mode === 'perform') perform.pending = true;
        else { train.beatInItem = 0; train.force = true; }
      }
    }
  }

  /* drain scheduled beats at their audio time */
  const t = Audio.now();
  while(metro.queue.length && metro.queue[0].t <= t){
    const e = metro.queue.shift();
    const dot = $('beatDot');
    dot.className = 'dot beat' + (e.accent ? ' accent' : '');
    setTimeout(() => dot.className = 'dot', 90);
    if(!session.running) continue;
    if(session.mode === 'perform'){
      if(e.event) performPrompt();
      paintBeatRail(e.beatInChord);
    } else if(e.event){
      session.sectionIndex = e.event.section;
      trainPrompt(e.event.section, e.event.item);
      if(e.event.newSection) renderFlow();
    }
  }

  if(!session.running || session.paused) return;

  const el = elapsed();
  const left = Math.max(0, session.total - el);
  $('timer').textContent = clock(Math.ceil(left));
  $('railFill').style.width = Math.min(100, el / session.total * 100).toFixed(2) + '%';
  if(left <= 0) return finish();

  if(session.mode !== 'train' || !session.plan) return;
  const sec = session.plan.sections[train.sectionIndex];
  const done = (train.itemIndex * sec.beatsPerItem + train.beatInItem) * (60 / bpm());
  updateFlowFill(done, sec.length);
}

function start(){
  Audio.ensure();
  stopSession(false);
  session.running = true; session.paused = false;
  session.startedAt = performance.now(); session.pausedFor = 0; session.skew = 0;
  session.sectionIndex = -1; session.itemIndex = -1;

  if(session.mode === 'perform'){
    session.total = clamp($('performMinutes').value, 1, 15, 5) * 60;
    perform.progression = rand(PROGRESSIONS);
    perform.degrees = progressionDegrees(perform.progression);
    perform.chordIndex = 0;
    perform.constraint = rand(CONSTRAINTS);
    perform.beatInChord = 0;
    perform.pending = true;                 // first beat fires chord 1
    performPrompt();
  } else {
    session.plan = buildPlan(clamp($('trainMinutes').value, 3, 20, 10) * 60);
    session.total = session.plan.total;
    train.sectionIndex = 0; train.itemIndex = 0; train.beatInItem = 0;
    train.newSection = false; train.force = false;
    session.sectionIndex = 0;
    trainPrompt(0, 0);
    renderFlow();
  }

  $('timer').textContent = clock(session.total);
  $('railFill').style.width = '0%';
  $('pauseBtn').disabled = false;
  $('stopBtn').disabled = false;
  $('skipBtn').disabled = session.mode !== 'train';
  startMetro();
  render();
  Wake.sync();
}

function pause(){
  if(!session.running || session.paused) return;
  session.paused = true; session.pauseStart = performance.now();
  stopMetro(); Audio.stopPad();
  $('prompt').classList.add('is-paused');
  $('pauseBtn').textContent = 'Resume';
  Wake.sync();
}
function resume(){
  if(!session.paused) return;
  Audio.ensure();
  session.pausedFor += performance.now() - session.pauseStart;
  session.paused = false;
  $('prompt').classList.remove('is-paused');
  $('pauseBtn').textContent = 'Pause';
  /* restart the count so the current prompt gets its full four bars */
  if(session.mode === 'perform') perform.pending = true;
  else { train.beatInItem = 0; train.force = true; }
  startMetro();
  Wake.sync();
}

/* Jump to the top of the next section. The section you skip is time you get back:
   the clock moves forward, so the session ends that much sooner. */
function skipSection(){
  if(!session.running || session.mode !== 'train' || !session.plan) return;
  const {sections} = session.plan;
  const s = train.sectionIndex;
  session.skew += (sections[s].end + .05) - elapsed();
  if(s < sections.length - 1){
    train.sectionIndex = s + 1;
    train.itemIndex = 0;
    train.beatInItem = 0;
    train.newSection = true;
    train.force = true;
  }
  if(session.paused) resume();
}

function stopSession(resetPrompt = true){
  session.running = false; session.paused = false;
  stopMetro(); Audio.stopPad();
  Wake.sync();
  metro.queue.length = 0;
  $('prompt').classList.remove('is-paused');
  $('pauseBtn').textContent = 'Pause';
  $('pauseBtn').disabled = true;
  $('stopBtn').disabled = true;
  $('skipBtn').disabled = true;
  if(resetPrompt) resetStage();
}

function finish(){
  session.running = false;
  stopMetro(); Audio.stopPad();
  Wake.sync();
  $('pauseBtn').disabled = true; $('stopBtn').disabled = true; $('skipBtn').disabled = true;
  $('constraintSlot').innerHTML = '';
  setPrompt({
    eyebrow:'Done',
    title:'Session complete',
    lede:'Log it to advance tomorrow’s position.',
    idle:true
  });
  renderFlow();
}

/* ============================================================
   7. Render
   ============================================================ */
function resetStage(){
  const isTrain = session.mode === 'train';
  if(isTrain){
    session.plan = buildPlan(clamp($('trainMinutes').value, 3, 20, 10) * 60);
    session.total = session.plan.total;
  } else {
    session.plan = null;
    session.total = clamp($('performMinutes').value, 1, 15, 5) * 60;
  }
  $('timer').textContent = clock(session.total);
  $('railFill').style.width = '0%';
  $('constraintSlot').innerHTML = '';
  session.sectionIndex = -1; session.itemIndex = -1;
  setPrompt({
    eyebrow:isTrain ? 'Train' : 'Perform',
    title:isTrain ? 'Ready when you are' : 'Ready to jam',
    lede:isTrain
      ? `Every prompt is held for four bars, so each chord in the rotation gets the same time. Runs to ${clock(session.total)} at ${bpm()} BPM.`
      : `A random progression built from the chords of ${key()} major — the key you have been practising. Four bars a chord, new constraint each change.`,
    idle:true
  });
  renderFlow();
}

function renderFlow(){
  $('flowTitle').textContent = session.mode === 'train' ? 'Session flow' : 'How perform works';
  const rows = session.plan
    ? session.plan.sections.map(sec => [sec.name, `${sec.items} × ${clock(sec.itemSeconds)}`])
    : TRAIN_BLOCKS.map(b => [b[0], `${b[2]} bars each`]);
  $('flowList').innerHTML = session.mode === 'train'
    ? rows.map((r, i) => {
        const state = session.running
          ? (i === session.sectionIndex ? ' is-active' : (i < session.sectionIndex ? ' is-done' : ''))
          : '';
        return `<div class="row${state}" data-section="${i}"><span>${r[0]}</span><span>${r[1]}</span><i class="row__fill"></i></div>`;
      }).join('')
    : [['Chords','From the practised key'],['Progression','Assigned at random'],['Each chord','4 bars · 16 beats'],['Constraint','New one per chord']]
        .map(r => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}
function updateFlowFill(sectionElapsed, sectionLength){
  const el = document.querySelector(`#flowList .row[data-section="${session.sectionIndex}"] .row__fill`);
  if(el) el.style.width = Math.min(100, sectionElapsed / sectionLength * 100) + '%';
}

function render(){
  const p = position();
  $('keyChip').textContent = 'Key ' + key();
  $('positionChip').textContent = p.name;
  $('bpmChip').textContent = bpm() + ' BPM';
  $('shapeHint').textContent = p.major.replace(' shape','') + ' / ' + p.minor.replace(' shape','') + ' shapes';

  const idx = Number($('positionSelect').value);
  $('rotationList').innerHTML = POSITIONS.map((pos, i) =>
    `<div class="row${i === idx ? ' is-active' : ''}"><span>${pos.name}</span><span>${pos.major.replace(' shape','')} / ${pos.minor.replace(' shape','')}</span></div>`
  ).join('');

  const nextPos = POSITIONS[(Number(store.get('cagedLastPosition', -1)) + 1) % POSITIONS.length].name;
  $('progressList').innerHTML = [
    ['Sessions logged', store.get('cagedSessions', 0)],
    ['Last session', store.get('cagedLastSession', 'Not yet')],
    ['Up next', nextPos]
  ].map(r => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}

function setMode(next){
  if(session.mode === next) return;
  stopSession(false);
  session.mode = next;
  document.body.classList.toggle('mode-perform', next === 'perform');
  document.body.classList.toggle('mode-train', next === 'train');
  $('trainTab').setAttribute('aria-selected', next === 'train');
  $('performTab').setAttribute('aria-selected', next === 'perform');
  $('startBtn').textContent = next === 'train' ? 'Start train' : 'Start perform';
  $('trainMinutesField').hidden = next !== 'train';
  $('performMinutesField').hidden = next === 'train';
  $('mixCard').hidden = next === 'train';
  $('skipBtn').hidden = next !== 'train';
  $('trainBpmField').hidden = next !== 'train';
  $('performBpmField').hidden = next === 'train';
  resetStage();
  render();
}

/* ============================================================
   8. Wiring
   ============================================================ */
KEYS.forEach(k => $('keySelect').add(new Option(k, k)));
POSITIONS.forEach((p, i) => $('positionSelect').add(new Option(p.name, i)));
$('positionSelect').value = (Number(store.get('cagedLastPosition', -1)) + 1) % POSITIONS.length;

$('trainTab').onclick = () => setMode('train');
$('performTab').onclick = () => setMode('perform');
$('startBtn').onclick = start;
$('pauseBtn').onclick = () => session.paused ? resume() : pause();
$('stopBtn').onclick = () => stopSession(true);
$('skipBtn').onclick = skipSection;
$('metroBtn').onclick = () => metro.on ? stopMetro() : startMetro();

$('completeBtn').onclick = () => {
  store.set('cagedLastPosition', $('positionSelect').value);
  store.set('cagedSessions', Number(store.get('cagedSessions', 0)) + 1);
  store.set('cagedLastSession', new Date().toLocaleDateString());
  $('positionSelect').value = (Number($('positionSelect').value) + 1) % POSITIONS.length;
  render();
};

$('backingToggle').onchange = e => Audio.backing(e.target.checked ? Number($('backingVolume').value) / 100 : 0);
$('metroVolume').oninput = e => { $('metroVolumeOut').textContent = e.target.value + '%'; Audio.metro(e.target.value / 100); };
$('backingVolume').oninput = e => {
  $('backingVolumeOut').textContent = e.target.value + '%';
  if($('backingToggle').checked) Audio.backing(e.target.value / 100);
};

$('diagramMode').value = store.get('cagedDiagram', 'full');
$('labelMode').value = store.get('cagedLabels', 'interval');
function syncDiagramUI(){
  $('labelField').hidden = diagramMode() !== 'full';
  store.set('cagedDiagram', diagramMode());
  store.set('cagedLabels', labelMode());
}
['diagramMode','labelMode'].forEach(id => $(id).addEventListener('change', () => {
  syncDiagramUI();
  if(!session.running) return resetStage();
  session.mode === 'perform' ? performPrompt() : trainPrompt(train.sectionIndex, train.itemIndex);
}));
syncDiagramUI();

['keySelect','positionSelect','bpmInput','trainBpm'].forEach(id => $(id).addEventListener('change', render));
['trainMinutes','performMinutes','trainBpm','keySelect'].forEach(id =>
  $(id).addEventListener('change', () => { if(!session.running) resetStage(); }));

document.addEventListener('keydown', e => {
  if(e.target.matches('input,select,textarea')) return;
  if(e.code === 'Space'){
    e.preventDefault();
    session.running ? (session.paused ? resume() : pause()) : start();
  }
  if((e.key || '').toLowerCase() === 'm'){ metro.on ? stopMetro() : startMetro(); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); skipSection(); }
});

resetStage();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
