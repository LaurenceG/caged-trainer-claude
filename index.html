<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CAGED Trainer</title>
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --canvas:#f5f5f7;
  --surface:#ffffff;
  --surface-sunken:#f2f2f5;
  --ink:#1d1d1f;
  --ink-2:#6e6e73;
  --ink-3:#a1a1a6;
  --hairline:rgba(0,0,0,.09);
  --hairline-soft:rgba(0,0,0,.05);
  --accent:#0071e3;
  --accent-ink:#0071e3;
  --accent-wash:rgba(0,113,227,.10);
  --red:#d70015;
  --shadow-1:0 1px 2px rgba(0,0,0,.05);
  --shadow-2:0 1px 2px rgba(0,0,0,.04),0 12px 32px -16px rgba(0,0,0,.28);
  --r-lg:22px;
  --r-md:14px;
  --r-sm:10px;
  --ease:cubic-bezier(.32,.72,0,1);
  /* 7.15:1 against white with white text on the fill — WCAG AA for text, AAA for graphics */
  --dot:#0F52BA;
  --dot-ink:#0F52BA;
  --dot-on-ink:#ffffff;
}
body.mode-perform{
  --accent:#5e5ce6;
  --accent-ink:#4f4dd6;
  --accent-wash:rgba(94,92,230,.10);
}
body.mode-test{
  --accent:#0a7c5a;
  --accent-ink:#08694c;
  --accent-wash:rgba(10,124,90,.10);
  --dot:#0a6e50;
  --dot-ink:#0a6e50;
}
@media (prefers-color-scheme:dark){
  :root{
    --canvas:#000000;
    --surface:#1c1c1e;
    --surface-sunken:#2c2c2e;
    --ink:#f5f5f7;
    --ink-2:#98989d;
    --ink-3:#6e6e73;
    --hairline:rgba(255,255,255,.12);
    --hairline-soft:rgba(255,255,255,.07);
    --accent:#0a84ff;
    --accent-ink:#4ea6ff;
    --accent-wash:rgba(10,132,255,.16);
    --red:#ff453a;
    --shadow-1:none;
    --shadow-2:none;
    --dot:#7CBBFF;          /* 8.43:1 against the dark surface */
    --dot-ink:#7CBBFF;
    --dot-on-ink:#0b1220;   /* 9.28:1 on the fill */
  }
  body.mode-perform{
    --accent:#7d7aff;
    --accent-ink:#a5a3ff;
    --accent-wash:rgba(125,122,255,.18);
  }
  body.mode-test{
    --accent:#2ec49a;
    --accent-ink:#5fdcb8;
    --accent-wash:rgba(46,196,154,.16);
    --dot:#5fdcb8;
    --dot-ink:#5fdcb8;
    --dot-on-ink:#062018;
  }
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-wash);outline-offset:2px;border-radius:8px}

.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 56px}

/* ============================================================
   Masthead + segmented control
   ============================================================ */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.masthead h1{font-size:30px;font-weight:600;letter-spacing:-.022em}
.masthead p{color:var(--ink-2);font-size:15px;margin-top:3px}

.seg{position:relative;display:flex;background:var(--surface-sunken);border-radius:12px;padding:3px;min-width:300px}
.seg__thumb{position:absolute;top:3px;left:3px;width:calc(33.333% - 2px);height:calc(100% - 6px);background:var(--surface);border-radius:9px;box-shadow:var(--shadow-1);transition:transform .32s var(--ease);pointer-events:none}
body.mode-perform .seg__thumb{transform:translateX(100%)}
body.mode-test .seg__thumb{transform:translateX(200%)}
.seg button{position:relative;flex:1;border:0;background:none;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;border-radius:9px;transition:color .2s}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:600}

/* ============================================================
   Cards
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:var(--r-lg);box-shadow:var(--shadow-2)}
.card__title{font-size:13px;font-weight:600;letter-spacing:-.005em;color:var(--ink-2);padding:16px 18px 10px}

.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px}

/* ============================================================
   Stage
   ============================================================ */
.stage{display:flex;flex-direction:column;min-height:498px;overflow:hidden}
.stage__bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-sunken);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);opacity:.4;transition:opacity .06s linear,transform .06s linear,background-color .06s linear}
.dot.beat{opacity:1;transform:scale(1.45);background:var(--accent)}
.dot.beat.accent{transform:scale(1.9)}

.timer{font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.rail{height:2px;background:var(--hairline-soft)}
.rail__fill{height:100%;width:0;background:var(--accent);transition:width .4s linear}

/* Prompt */
.prompt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:34px 30px;transition:opacity .3s ease}
.prompt__eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.prompt__title{font-size:52px;font-weight:600;letter-spacing:-.035em;line-height:1.02}
.prompt__lede{font-size:17px;color:var(--ink-2);max-width:42ch}
.prompt.is-idle .prompt__title{font-size:34px;letter-spacing:-.028em}
.prompt.is-paused{opacity:.42}
.prompt__head{animation:enter .34s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Detail cards */
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--hairline-soft);border:1px solid var(--hairline-soft);border-radius:var(--r-md);overflow:hidden}
.detail{background:var(--surface);padding:12px 14px}
.detail dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.detail dd{margin:0;font-size:19px;font-weight:500;letter-spacing:-.015em}
.detail dd .sub{color:var(--ink-3);font-weight:400}

/* Progression rail (signature element) */
.prog{display:grid;gap:14px}
.prog__chords{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chord{display:inline-flex;flex-direction:column;align-items:center;min-width:70px;padding:7px 14px 6px;border-radius:12px;background:var(--surface-sunken);color:var(--ink-2);transition:background-color .28s var(--ease),color .28s var(--ease),transform .28s var(--ease)}
.chord b{font-size:19px;font-weight:500;letter-spacing:-.015em}
.chord i{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.07em;opacity:.6;margin-top:1px}
.chord.is-active{background:var(--accent);color:#fff;transform:scale(1.04)}
.prog__beats{display:flex;gap:10px}
.measure{display:flex;gap:4px;flex:1}
.tick{flex:1;height:4px;border-radius:2px;background:var(--hairline);transition:background-color .1s linear}
.tick.on{background:var(--accent)}
.tick.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}

/* Fretboard — role is carried by silhouette, not colour, so the diagram
   still reads with any colour vision. Colour is redundant reinforcement. */
.fb{width:100%;max-width:420px;height:auto;display:block}
.fb-str,.fb-fret{stroke:var(--hairline);stroke-width:1}
.fb-nut{stroke:var(--ink-2);stroke-width:2.5}
.fb-inlay{fill:var(--ink-3);opacity:.22}
.fb-num,.fb-name{fill:var(--ink-2);font-size:10.5px;font-weight:600}
.fb-num{text-anchor:middle}
.fb-name{text-anchor:end}
.fb-mark{fill:var(--surface);stroke:var(--dot);stroke-width:1.6}
.fb-mark.filled{fill:var(--dot);stroke:var(--dot)}
.fb-mark.dashed{stroke-dasharray:3.2 2.6}
.fb-inner{fill:none;stroke:var(--surface);stroke-width:1.3;stroke-dasharray:2.2 2.4;opacity:.9}
.fb-ring{fill:none;stroke:var(--dot);stroke-width:1.6}
.fb-txt{font-size:9.5px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--dot-ink)}
.fb-txt.on{fill:var(--dot-on-ink)}
.fb-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-2)}
.fb-legend span{display:inline-flex;align-items:center;gap:6px}
.fb-legend svg{flex:none}
/* Full-neck board for the root drill. No labels on the dots — every one is the
   same note, so the marker alone says it, and that keeps them legible at
   thirteen frets across on a phone. */
.nb{width:100%;max-width:520px;height:auto;display:block}
.nb-open{fill:none;stroke:var(--dot);stroke-width:1.6}
.nb-dot{fill:var(--dot)}
.nb-reveal{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.nb-count{font-size:13px;color:var(--ink-2)}

/* Constraint */
.constraint{border:1px solid var(--hairline);border-radius:var(--r-md);padding:14px 16px;background:var(--accent-wash)}
.constraint dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:3px}
.constraint dd{margin:0;font-size:20px;font-weight:500;letter-spacing:-.018em}

/* Transport */
.transport{display:flex;gap:8px;flex-wrap:wrap;padding:16px 18px;border-top:1px solid var(--hairline-soft)}
.btn{border:1px solid transparent;border-radius:999px;padding:9px 17px;font-size:14.5px;font-weight:500;cursor:pointer;background:var(--surface-sunken);color:var(--ink);transition:transform .12s var(--ease),opacity .2s,background-color .2s}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.97)}
.btn--primary{background:var(--accent);color:#fff}
.btn--quiet{background:transparent;color:var(--ink-2)}
.btn--danger{background:transparent;color:var(--red)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.transport .spacer{flex:1}

/* ============================================================
   Settings
   ============================================================ */
.settings{padding:6px 18px 18px}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hairline-soft)}
.field:last-child{border-bottom:0}
.field > label{font-size:14.5px;font-weight:450}
.field .hint{display:block;font-size:12.5px;color:var(--ink-3)}
select,input[type="number"]{
  appearance:none;-webkit-appearance:none;
  border:1px solid var(--hairline);border-radius:var(--r-sm);
  background:var(--surface-sunken);color:var(--ink);
  padding:7px 10px;font:inherit;font-size:14.5px;text-align:right;
  max-width:200px;
}
select{padding-right:28px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23a1a1a6' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
input[type="number"]{width:76px;font-variant-numeric:tabular-nums}

.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface-sunken);border:1px solid var(--hairline);transition:background-color .28s var(--ease)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .28s var(--ease)}
.switch input:checked + span{background:var(--accent);border-color:transparent}
.switch input:checked + span::after{transform:translateX(20px)}

input[type="range"]{-webkit-appearance:none;appearance:none;width:132px;background:none}
input[type="range"]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--hairline)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28)}
input[type="range"]::-moz-range-track{height:4px;border-radius:2px;background:var(--hairline)}
input[type="range"]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.slider{display:flex;align-items:center;gap:10px}
.slider output{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;width:38px;text-align:right}
[hidden]{display:none !important}

/* ============================================================
   Lists
   ============================================================ */
.list{padding:0 8px 8px}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 10px;border-radius:var(--r-sm);font-size:14.5px;overflow:hidden}
.row + .row{box-shadow:inset 0 1px 0 var(--hairline-soft)}
.row span:last-child{color:var(--ink-2);font-size:13.5px;text-align:right}
.row.is-active{background:var(--accent-wash);box-shadow:none}
.row.is-active + .row{box-shadow:none}
.row.is-active span:first-child{color:var(--accent-ink);font-weight:600}
.row__fill{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent);transition:width .5s linear}
.row.is-done span:first-child{color:var(--ink-3)}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .stage{min-height:0}
}
@media (max-width:560px){
  .wrap{padding:20px 14px 40px}
  .masthead{align-items:flex-start}
  .seg{width:100%}
  .prompt{padding:26px 20px}
  .prompt__title{font-size:40px}
  .prompt.is-idle .prompt__title{font-size:27px}
  .timer{font-size:22px}
  .transport{padding:14px}
  .btn{flex:1;text-align:center}
  .transport .spacer{display:none}
}
@media (prefers-contrast:more){
  .fb-mark{stroke-width:2.2}
  .fb-str,.fb-fret{stroke:var(--ink-3)}
  .fb-txt{font-weight:800}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}


/* ---- skill test ---- */
#testPanel{display:grid;gap:16px}
.tt-level{padding:16px 18px 18px}
.tt-level header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.tt-level h3{font-size:16px;font-weight:600;margin:0}
.tt-help{font-weight:400;font-size:12.5px;color:var(--ink-3);margin-left:6px}
.tt-score{font-size:12.5px;font-weight:600;color:var(--accent-ink);flex:none}
.tt-level.locked{opacity:.55}
.tt-locked{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
.tt-cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:14px}
.tt-cell{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;
  border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);
  padding:11px 13px;cursor:pointer;color:var(--ink);font:inherit}
.tt-cell b{font-size:14px;font-weight:600}
.tt-cell span{font-size:12px;color:var(--ink-3)}
.tt-cell.ok{border-color:var(--accent);background:var(--accent-wash)}
.tt-cell.ok span{color:var(--accent-ink)}
.tt-cell.soon,.tt-cell[disabled]{cursor:default;background:var(--surface-sunken);border-color:transparent}
.tt-cell.soon b{color:var(--ink-3)}
.tt-pos{display:flex;gap:4px;margin-top:7px}
.tt-pos button{width:26px;height:26px;border-radius:7px;border:1px solid var(--hairline);
  background:var(--surface);font:inherit;font-size:12px;cursor:pointer;color:var(--ink-2);padding:0}
.tt-pos button.ok{background:var(--accent);color:#fff;border-color:transparent}
.tt-pos button[disabled]{cursor:default;opacity:.5}

.tt{overflow:hidden}
.tt-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:16px 18px 12px}
.tt-eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.tt-head h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:2px 0 3px}
.tt-sub{font-size:13px;color:var(--ink-2)}
.tt-body{padding:6px 18px 18px;display:grid;gap:14px}
.tt-centre{justify-items:center;text-align:center}
.tt-blurb{font-size:14.5px;color:var(--ink-2);line-height:1.5;margin:0;max-width:52ch}
.tt-count{font-size:76px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums}
.tt-now{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.tt-nowsub{font-size:13.5px;color:var(--ink-2);margin-top:-6px}
.tt-clock{font-size:20px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tt-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 18px;border-top:1px solid var(--hairline-soft)}
.tt-note{font-size:12px;color:var(--ink-3);max-width:34ch;line-height:1.4}
.tt-marks{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.tt-mark{border:1px solid var(--hairline);border-radius:var(--r-md);padding:9px 11px;cursor:pointer;
  font:inherit;text-align:left;background:var(--surface);color:var(--ink);display:flex;flex-direction:column}
.tt-mark b{font-size:15px;font-weight:600}
.tt-mark span{font-size:11.5px;color:var(--ink-3)}
.tt-mark.ok{border-color:var(--accent);background:var(--accent-wash)}
.tt-mark.no{border-color:var(--red);background:transparent;opacity:.7}
.tt-mark.no b{text-decoration:line-through;color:var(--red)}
.tt-yesno{display:flex;gap:9px}
.tt-result{font-size:30px;font-weight:600;letter-spacing:-.025em}
.tt-result.pass{color:var(--accent-ink)}
.tt-result.fail{color:var(--ink-2)}

/* ---- practice motivation ---- */
.mv-lede{font-size:14.5px;color:var(--ink-2);line-height:1.5;margin:0 0 4px}
.mv-note{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:12px 0 0}
.mv-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mv-chips button{border:1px solid var(--hairline);background:var(--surface-sunken);border-radius:999px;
  padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.mv-quote{margin:10px 0 0;padding:13px 15px;border-left:3px solid var(--accent);background:var(--accent-wash);
  border-radius:0 var(--r-md) var(--r-md) 0;font-size:16px;font-weight:500;color:var(--ink)}
.mv-anchors{margin:12px 0 18px;padding-left:20px;font-size:12.5px;color:var(--ink-3);line-height:1.65}
.mv-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--hairline-soft);font-size:14.5px}
.mv-row:last-child{border-bottom:0}
.mv-scale{display:flex;gap:5px;flex:none}
.mv-scale button{width:34px;height:34px;border:1px solid var(--hairline);background:var(--surface);
  border-radius:9px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.mv-scale button.on{background:var(--accent);color:#fff;border-color:transparent}
.mv-trend{display:inline-flex;align-items:center;gap:9px}
.mv-spark{width:84px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.6;
  stroke-linejoin:round;stroke-linecap:round;overflow:visible}
.mv-trend b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:12px;text-align:right}
.mv-nodata{color:var(--ink-3);width:84px;display:inline-block;text-align:center}
.mv-foot{font-size:11.5px;color:var(--ink-3);padding:0 18px 15px;margin:0;line-height:1.5}

/* ---- feedback widget ---- */
.fbfab{position:fixed;right:16px;bottom:16px;z-index:40;border:0;border-radius:999px;
  background:var(--ink);color:var(--canvas);padding:12px 20px;font-size:14.5px;font-weight:600;
  cursor:pointer;box-shadow:0 6px 20px -6px rgba(0,0,0,.4)}
.fbfab:active{transform:scale(.97)}
.fbwrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);display:flex;
  align-items:flex-end;justify-content:center;padding:0}
.fbsheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;

      <button id="performTab" role="tab" aria-selected="false">Perform</button>
