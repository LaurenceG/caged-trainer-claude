<script>
"use strict";

/* ============================================================
   1. Music model
   ============================================================ */
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const PITCH  = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

const KEYS = ['A','Bb','B','C','C#','D','D#','E','F','F#','G','G#'];
const SCALE = {major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10]};
const QUALITY = {major:['','m','m','','','m','dim'], minor:['m','dim','','m','m','','']};

const POSITIONS = [
  {name:'1st position', major:'E shape', minor:'Dm shape'},
  {name:'2nd position', major:'D shape', minor:'Cm shape'},
  {name:'3rd position', major:'C shape', minor:'Am shape'},
  {name:'4th position', major:'A shape', minor:'Gm shape'},
  {name:'5th position', major:'G shape', minor:'Em shape'}
];

/* name, share of the session, bars each prompt is held for */
const TRAIN_BLOCKS = [
  ['Note recall', 120, 8],   /* 8 bars = 32s at 60 BPM; share raised so it still fits four notes */
  ['Chord shape', 90,  4],
  ['Arpeggio',    120, 4],
  ['Full scale',  180, 4],
  ['Pentatonic',  90,  4]
];

const CONSTRAINTS = [
  'Full arpeggio',
  'Triad — root, 3rd / ♭3rd and 5th',
  'Target the root',
  'Target the 3rd / ♭3rd',
  'Target the 5th',
  'Hit all chord tones at least once',
  'Use the full major / minor scale',
  'Use only the major / minor pentatonic scale',
  'Bottom (high) 2 strings only',
  'Middle 2 strings only',
  'Top (low) 2 strings only'
];

const PROGRESSIONS = [
  {name:'Pop rock',        mode:'major', degrees:['1','5','6','4']},
  {name:'Classic rock',    mode:'major', degrees:['1','4','5']},
  {name:'50s rock',        mode:'major', degrees:['1','6','4','5']},
  {name:'Folk rock',       mode:'major', degrees:['1','5','4']},
  {name:'Rock anthem',     mode:'major', degrees:['6','4','1','5']},
  {name:'Alternative minor',mode:'minor',degrees:['1','6','3','7']},
  {name:'Dark rock',       mode:'minor', degrees:['1','7','6','7']},
  {name:'Minor rock',      mode:'minor', degrees:['1','4','7']},
  {name:'Cinematic minor', mode:'minor', degrees:['1','6','7']},
  {name:'Modal rock',      mode:'minor', degrees:['1','3','7','6']}
];

/* A plain pop-keyboard comp, positions measured in beats within the bar:
   bass root on the downbeat, chord on 1 and 3, light stabs off the beat.
   Held notes ring across the gaps, so it breathes instead of droning. */
const COMP = [
  {at:0,   voice:'bass',  level:1.00},
  {at:0,   voice:'triad', level:.78},
  {at:1.5, voice:'upper', level:.42},
  {at:2,   voice:'triad', level:.62},
  {at:2.5, voice:'upper', level:.34},
  {at:3.5, voice:'upper', level:.50}
];
const voicing = (m, v) => v === 'bass'  ? [m[0] - 12]
                        : v === 'upper' ? [m[1], m[2], m[3]]
                        :                 [m[0], m[1], m[2]];

const COMP_TAIL_BEATS = 1.25; // how long a struck note rings, in beats
const BEATS_PER_CHORD = 16;   // four bars of 4/4
const BEATS_PER_BAR = 4;
const ROTATION = 6;           // degrees 1-6 in a position

/* Both spellings, because the learner needs to recognise either */
const CHROMATIC = ['C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭','A','A♯/B♭','B'];
const ROMAN = ['I','ii','iii','IV','V','vi','vii°'];

/* A minor-flavoured progression is the same key heard from its sixth degree,
   so every chord stays diatonic to the major key just practised. */
const minorDegreeToMajor = d => ((Number(d) - 1 + 5) % 7) + 1;
const progressionDegrees = p =>
  p.mode === 'major' ? p.degrees.map(Number) : p.degrees.map(minorDegreeToMajor);

/* Spell accidentals the way the key is actually read, not always as sharps */
const FLAT_MAJOR = new Set(['F','Bb','Eb','Ab','Db','Gb']);
const FLAT_MINOR = new Set(['D','G','C','F','Bb','Eb','Ab','Db']);
const prefersFlats = (key, mode) => key.includes('b') || (mode === 'minor' ? FLAT_MINOR : FLAT_MAJOR).has(key);
const noteName = (pc, flats) => (flats ? FLATS : SHARPS)[((pc % 12) + 12) % 12];

function chordName(key, mode, degree){
  const i = Number(degree) - 1;
  return noteName(PITCH[key] + SCALE[mode][i], prefersFlats(key, mode)) + QUALITY[mode][i];
}
function chordMidi(key, mode, degree, octave = 3){
  const i = Number(degree) - 1, steps = SCALE[mode], base = 12 * (octave + 1) + PITCH[key];
  const at = n => base + steps[n % 7] + (n >= 7 ? 12 : 0);
  const root = base + steps[i];
  return [root, at(i + 2), at(i + 4), root + 12];
}

const rand = a => a[Math.floor(Math.random() * a.length)];
const clock = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2,'0');
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th','st','nd','rd'][n % 10] || 'th');
const shapeHtml = label => String(label).replace(/\s*\(([^)]+)\)/, ' <span class="sub">($1)</span>');

/* ---- CAGED shape data ---------------------------------------------------
   From the approved shape reference. Each shape is a five-fret window whose
   first column sits at (root + anchor) mod 12, filled with that shape's own
   major or natural-minor scale. Ten shapes, one number each. */
const STRING_PC = [4, 11, 7, 2, 9, 4];          // high e down to low E
const STRING_NAME = ['e','B','G','D','A','E'];
const FRET_SPAN = 5;                            // columns per shape
const MINOR_STEPS = [0, 2, 3, 5, 7, 8, 10];
const INTERVAL = ['1','\u266d2','2','\u266d3','3','4','\u266d5','5','\u266d6','6','\u266d7','7'];
const INLAYS = [3,5,7,9,15,17,19,21];

const SHAPES = {
  'E shape': {anchor:7,  minor:false, related:null},
  'D shape': {anchor:9,  minor:false, related:null},
  'C shape': {anchor:0,  minor:false, related:null},
  'A shape': {anchor:2,  minor:false, related:null},
  'G shape': {anchor:4,  minor:false, related:null},
  'Dm shape':{anchor:10, minor:true,  related:'E shape'},
  'Cm shape':{anchor:0,  minor:true,  related:'D shape'},
  'Am shape':{anchor:3,  minor:true,  related:'C shape'},
  'Gm shape':{anchor:5,  minor:true,  related:'A shape'},
  'Em shape':{anchor:7,  minor:true,  related:'G shape'}
};

/* Degree 1-6 for each position. The 7th has no core shape and is not drilled. */
const POSITION_MAP = {
  '1st position':['E shape','Gm shape','Am shape','A shape','C shape','Dm shape'],
  '2nd position':['D shape','Em shape','Gm shape','G shape','A shape','Cm shape'],
  '3rd position':['C shape','Dm shape','Em shape','E shape','G shape','Am shape'],
  '4th position':['A shape','Cm shape','Dm shape','D shape','E shape','Gm shape'],
  '5th position':['G shape','Am shape','Cm shape','C shape','D shape','Em shape']
};

const shapeNameFor = (positionName, degree) => POSITION_MAP[positionName][Number(degree) - 1];
const shapeLabel = name => {
  const sh = SHAPES[name];
  return name.replace(' shape','') + (sh.related ? ' (' + sh.related.replace(' shape','') + ')' : '');
};
const degreeRootPc = (keyName, degree) => (PITCH[keyName] + SCALE.major[Number(degree) - 1]) % 12;

/* Every note of a shape, placed for a given root. role is one of
   root | chord | other; pent says whether it survives into the pentatonic. */
function shapeNotes(shapeName, rootPc){
  const sh = SHAPES[shapeName];
  const steps = sh.minor ? MINOR_STEPS : SCALE.major;
  const chord = (sh.minor ? [0,3,7] : [0,4,7]).map(x => (rootPc + x) % 12);
  const pent  = (sh.minor ? [0,3,5,7,10] : [0,2,4,7,9]).map(x => (rootPc + x) % 12);
  const scale = steps.map(x => (rootPc + x) % 12);
  const start = (rootPc + sh.anchor) % 12;
  const notes = [];
  for(let st = 0; st < 6; st++){
    for(let c = 0; c < FRET_SPAN; c++){
      const fret = start + c, pc = (STRING_PC[st] + fret) % 12;
      if(!scale.includes(pc)) continue;
      notes.push({
        st, c, fret, pc,
        iv: INTERVAL[(pc - rootPc + 12) % 12],
        role: pc === rootPc ? 'root' : (chord.includes(pc) ? 'chord' : 'other'),
        pent: pent.includes(pc)
      });
    }
  }
  return {start, notes};
}

/* Storage that degrades gracefully in sandboxed frames */
const store = (() => {
  const mem = {};
  const ok = (() => { try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; } })();
  return {
    get:(k,d) => { try { return (ok ? localStorage.getItem(k) : mem[k]) ?? d; } catch(e){ return d; } },
    set:(k,v) => { try { ok ? localStorage.setItem(k,v) : (mem[k] = String(v)); } catch(e){} }
  };
})();

/* ============================================================
   2. Audio engine — one context, three buses, sample-accurate clock
   ============================================================ */
const Audio = (() => {
  let ctx = null, metroBus = null, backingBus = null, cueBus = null, voices = [];

  function build(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    metroBus = ctx.createGain();   metroBus.gain.value = .75;
    backingBus = ctx.createGain(); backingBus.gain.value = .45;
    cueBus = ctx.createGain();     cueBus.gain.value = .9;
    [metroBus, backingBus, cueBus].forEach(b => b.connect(ctx.destination));
  }
  /* Synchronous on purpose. iOS only honours resume() inside the tap that
     triggered it, so this must never sit behind an await. */
  function ensure(){
    if(!ctx) build();
    if(ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  const suspended = () => !!ctx && ctx.state !== 'running';
  const now = () => ctx ? ctx.currentTime : 0;
  const setGain = (bus, v) => { if(ctx) bus.gain.setTargetAtTime(v, ctx.currentTime, .02); };

  function env(node, t, peak, attack, decay){
    node.gain.setValueAtTime(.0001, t);
    node.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t + attack);
    node.gain.exponentialRampToValueAtTime(.0001, t + decay);
  }

  function click(accent, t){
    if(!ctx) return;
    const g = ctx.createGain();
    g.connect(metroBus);
    if(accent){
      const o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = 1050;
      env(g, t, .16, .004, .09);
      o.connect(g); o.start(t); o.stop(t + .1);
    } else {
      const len = Math.floor(ctx.sampleRate * .028);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
      const src = ctx.createBufferSource(), hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 1500;
      g.gain.setValueAtTime(.11, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .035);
      src.buffer = buf; src.connect(hp); hp.connect(g); src.start(t);
    }
  }

  function cue(t = now()){                    // new prompt
    if(!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(1150, t);
    o.frequency.exponentialRampToValueAtTime(1500, t + .12);
    env(g, t, .10, .01, .38);
    o.connect(g); g.connect(cueBus); o.start(t); o.stop(t + .42);
  }

  function bell(t = now()){                   // new section
    if(!ctx) return;
    [660, 880, 1100].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f;
      env(g, t, .14 / (i + 1), .01, 1.2);
      o.connect(g); g.connect(cueBus); o.start(t); o.stop(t + 1.25);
    });
  }

  function prune(t){ voices = voices.filter(v => v.until > t - .1); }

  function hush(t = now()){
    voices.forEach(v => {
      try {
        v.g.gain.cancelScheduledValues(t);
        v.g.gain.setValueAtTime(Math.max(v.g.gain.value, .0001), t);
        v.g.gain.exponentialRampToValueAtTime(.0001, t + .18);
        v.o1.stop(t + .22); v.o2.stop(t + .22);
      } catch(e){}
    });
    voices = [];
  }

  /* One struck note. Fast attack, quick initial decay to a sustain, long tail,
     with the filter closing as it rings — a plucked/struck envelope rather than
     the flat drone this replaced. Two slightly detuned oscillators give it body. */
  /* tail is passed in beats-worth of seconds by the caller, so the comp keeps
     the same feel at any tempo instead of smearing as the beats get closer */
  function strike(midis, t, level, tail){
    if(!ctx) return;
    tail = tail || 1.25;
    prune(t);
    midis.forEach(m => {
      const f = 440 * Math.pow(2, (m - 69) / 12);
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
      const lp = ctx.createBiquadFilter(), g = ctx.createGain();
      o1.type = 'triangle'; o2.type = 'sine';
      o1.frequency.value = f; o2.frequency.value = f * 1.004;
      lp.type = 'lowpass'; lp.Q.value = .7;
      lp.frequency.setValueAtTime(2900, t);
      lp.frequency.exponentialRampToValueAtTime(780, t + .55);
      const peak = Math.max(.0002, level * .085);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + .008);
      g.gain.exponentialRampToValueAtTime(peak * .34, t + .2);
      g.gain.exponentialRampToValueAtTime(.0001, t + tail);
      o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(backingBus);
      o1.start(t); o2.start(t);
      o1.stop(t + tail + .05); o2.stop(t + tail + .05);
      voices.push({o1, o2, g, until:t + tail + .05});
    });
  }

  return {
    ensure, suspended, now, click, cue, bell, strike, hush,
    metro:v => setGain(metroBus, v),
    backing:v => setGain(backingBus, v)
  };
})();

/* ============================================================
   3. State
   ============================================================ */
const $ = id => document.getElementById(id);

const session = {
  mode:'train', running:false, paused:false,
  total:600, startedAt:0, pausedFor:0, pauseStart:0, skew:0,
  plan:null, sectionIndex:-1, itemIndex:-1
};
const metro = { on:false, timer:null, nextBeat:0, beat:0, queue:[] };
const perform = { progression:null, degrees:[], chordIndex:0, constraint:'', beatInChord:0, pending:false, chord:null };
const train = { sectionIndex:0, itemIndex:0, beatInItem:0, newSection:false, force:false };

const clamp = (v, lo, hi, d) => Math.min(hi, Math.max(lo, Number(v) || d));
const bpm = () => session.mode === 'train'
  ? clamp($('trainBpm').value, 40, 140, 60)
  : clamp($('bpmInput').value, 40, 220, 80);
const position = () => POSITIONS[Number($('positionSelect').value)];
const positionShapes = () => POSITION_MAP[position().name].map((n, i) => [String(i + 1), n]);
const key = () => $('keySelect').value;

/* ============================================================
   3b. Screen wake lock — stop the phone locking mid-session
   ============================================================ */
const Wake = (() => {
  let lock = null;
  const ok = 'wakeLock' in navigator;
  async function acquire(){
    if(!ok || lock) return;
    try {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } catch(e){ lock = null; }
  }
  function release(){
    if(!lock) return;
    try { lock.release(); } catch(e){}
    lock = null;
  }
  /* The lock is dropped whenever the page is hidden, so take it again on return */
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') sync();
  });
  function sync(){ (session.running && !session.paused) || metro.on ? acquire() : release(); }
  return {sync, supported:ok};
})();

/* ============================================================
   4. Metronome — lookahead scheduler (no setInterval drift)
   ============================================================ */
const LOOKAHEAD = .12, TICK_MS = 25;

function schedule(){
  while(metro.nextBeat < Audio.now() + LOOKAHEAD){
    const t = metro.nextBeat;
    const accent = metro.beat % BEATS_PER_BAR === 0;
    let event = null;

    /* the test runs on the metronome but not on a timed session */
    if(session.mode === 'test' && tst.phase === 'running'){
      event = {kind:'testbeat'};
    }

    if(session.running && !session.paused){
      if(session.mode === 'perform' && perform.progression){
        if(perform.pending || perform.beatInChord >= BEATS_PER_CHORD){
          if(!perform.pending) advanceChord();
          perform.pending = false;
          perform.beatInChord = 0;
          perform.chord = chordMidi(key(), 'major', currentDegree());
          Audio.cue(t);
          event = {kind:'chord'};
        }
        const bar = perform.beatInChord % BEATS_PER_BAR, spb = 60 / bpm();
        if(perform.chord && $('backingToggle').checked)
          COMP.filter(h => Math.floor(h.at) === bar)
              .forEach(h => Audio.strike(voicing(perform.chord, h.voice),
                                         t + (h.at - bar) * spb, h.level, COMP_TAIL_BEATS * spb));
        perform.beatInChord++;
      } else if(session.mode === 'test'){
        /* handled below, outside the running-session guard */
      } else if(session.mode === 'train' && session.plan){
        const sec = session.plan.sections[train.sectionIndex];
        const last = session.plan.sections.length - 1;
        if(train.force || train.beatInItem >= sec.beatsPerItem){
          let hold = false;
          if(!train.force){
            train.itemIndex++;
            if(train.itemIndex >= sec.items){
              if(train.sectionIndex < last){
                train.sectionIndex++; train.itemIndex = 0; train.newSection = true;
              } else { train.itemIndex = sec.items - 1; hold = true; }
            }
          }
          train.force = false;
          train.beatInItem = 0;
          if(!hold){
            train.newSection ? Audio.bell(t) : Audio.cue(t);
            event = {kind:'item', section:train.sectionIndex, item:train.itemIndex, newSection:train.newSection};
            train.newSection = false;
          }
        }
        train.beatInItem++;
      }
    }

    Audio.click(accent, t);
    metro.queue.push({t, accent, event, beatInChord:perform.beatInChord});
    metro.beat++;
    metro.nextBeat += 60 / bpm();
  }
}

function startMetro(){
  stopMetro();
  Audio.ensure();                       // synchronous, inside the tap
  metro.on = true;
  metro.beat = 0;
  metro.nextBeat = Audio.now() + .08;
  metro.timer = setInterval(schedule, TICK_MS);
  schedule();
  $('metroBtn').textContent = 'Stop metronome';
  Wake.sync();
}
function stopMetro(){
  clearInterval(metro.timer);
  metro.timer = null; metro.on = false; metro.queue.length = 0;
  $('beatDot').className = 'dot';
  $('metroBtn').textContent = 'Metronome';
  Wake.sync();
}

/* ============================================================
   5. Prompts
   ============================================================ */
function setPrompt({eyebrow, title, lede = '', details = null, idle = false}){
  $('eyebrow').textContent = eyebrow;
  $('title').textContent = title;
  $('lede').textContent = lede;
  $('lede').hidden = !lede;
  $('prompt').classList.toggle('is-idle', idle);
  $('diagramSlot').innerHTML = '';
  $('detailSlot').innerHTML = details
    ? '<dl class="details">' + details.map(([k, v]) =>
        `<div class="detail"><dt>${k}</dt><dd>${v}</dd></div>`).join('') + '</dl>'
    : '';
  const head = $('promptHead');                       // replay the entrance
  head.style.animation = 'none'; void head.offsetWidth; head.style.animation = '';
}

/* Draws all twelve chromatic notes before repeating any, and remembers where
   it got to between sessions. Independent of key and position. */
const noteBag = (() => {
  let order = [], i = 0;
  function shuffle(avoidFirst){
    order = CHROMATIC.map((_, n) => n);
    for(let j = order.length - 1; j > 0; j--){
      const k = Math.floor(Math.random() * (j + 1));
      [order[j], order[k]] = [order[k], order[j]];
    }
    if(avoidFirst !== undefined && order[0] === avoidFirst) [order[0], order[1]] = [order[1], order[0]];
    i = 0;
  }
  try {
    const saved = JSON.parse(store.get('cagedNoteBag', 'null'));
    if(saved && Array.isArray(saved.order) && saved.order.length === CHROMATIC.length){
      order = saved.order; i = Math.min(saved.i | 0, order.length);
    } else shuffle();
  } catch(e){ shuffle(); }
  return {
    next(){
      if(i >= order.length) shuffle(order[order.length - 1]);
      const pitch = order[i++];
      store.set('cagedNoteBag', JSON.stringify({order, i}));
      return {name:CHROMATIC[pitch], pc:pitch, step:i};
    }
  };
})();

/* One draw per item, so a re-render doesn't burn a note */
let noteFor = (() => {
  let stamp = '', held = null;
  return (s, i) => {
    const id = s + ':' + i;
    if(id !== stamp){ stamp = id; held = noteBag.next(); }
    return held;
  };
})();

function trainPrompt(sectionIndex, itemIndex){
  const k = key();
  const section = session.plan.sections[sectionIndex].name;
  const [degree, shapeName] = positionShapes()[itemIndex % positionShapes().length];
  const shape = shapeHtml(shapeLabel(shapeName));
  const chord = chordName(k, 'major', degree);
  const isMinor = chord.endsWith('m');
  const root = chord.replace('m','');
  const place = [['CAGED shape', shape], ['Position', ordinal(Number($('positionSelect').value) + 1)], ['Degree', ordinal(Number(degree))]];

  if(section === 'Note recall'){
    const n = noteFor(sectionIndex, itemIndex);
    const id = sectionIndex + ':' + itemIndex;
    if(id !== revealKey){ revealKey = id; noteRevealed = false; }   /* new note, hide again */
    setPrompt({
      eyebrow:section,
      title:n.name,
      lede:`Find every ${n.name} on the neck, nut to twelfth fret.`,
      details:[['Note', n.step + ' of ' + CHROMATIC.length]]
    });
    if(diagramMode() !== 'off')
      $('diagramSlot').innerHTML = neckboard(n.pc, k, noteRevealed);
    return;
  }
  const focus = section === 'Full scale' ? 'scale' : section === 'Pentatonic' ? 'pent' : 'chord';
  const draw = () => {
    $('diagramSlot').innerHTML = fretboard(shapeName, degreeRootPc(k, degree), k, focus);
  };

  if(section === 'Chord shape'){
    setPrompt({eyebrow:section, title:chord, details:[['Play','Chord'], ...place]});
  } else if(section === 'Arpeggio'){
    setPrompt({eyebrow:section, title:chord, details:[['Play','Arpeggio'], ...place]});
  } else if(section === 'Full scale'){
    setPrompt({eyebrow:section, title:`${root} ${isMinor ? 'minor' : 'major'}`, details:[['Play','Full scale'], ...place]});
  } else {
    setPrompt({eyebrow:section, title:`${root} ${isMinor ? 'minor' : 'major'}`, details:[['Play','Pentatonic'], ...place]});
  }
  draw();
}

const currentDegree = () => perform.degrees[perform.chordIndex];

function advanceChord(){
  perform.chordIndex = (perform.chordIndex + 1) % perform.degrees.length;
  perform.constraint = rand(CONSTRAINTS);
}

function performPrompt(){
  const k = key(), p = perform.progression;
  setPrompt({
    eyebrow:`${p.name} · key of ${k}`,
    title:chordName(k, 'major', currentDegree())
  });
  $('detailSlot').innerHTML =
    '<div class="prog"><div class="prog__chords">' +
    perform.degrees.map((d, i) =>
      `<span class="chord${i === perform.chordIndex ? ' is-active' : ''}"><b>${chordName(k, 'major', d)}</b><i>${ROMAN[d - 1]}</i></span>`
    ).join('') +
    '</div><div class="prog__beats" id="beatRail">' +
    Array.from({length:BEATS_PER_CHORD / BEATS_PER_BAR}, () =>
      '<span class="measure">' + '<i class="tick"></i>'.repeat(BEATS_PER_BAR) + '</span>'
    ).join('') +
    '</div></div>';
  $('diagramSlot').innerHTML = fretboard(
    shapeNameFor(position().name, currentDegree()),
    degreeRootPc(k, currentDegree()), k, 'chord');
  $('constraintSlot').innerHTML =
    `<dl class="constraint"><dt>Constraint</dt><dd>${perform.constraint}</dd></dl>`;
}

/* ---- Fretboard renderer -------------------------------------------------
   Four states, each with its own silhouette so nothing depends on colour:
     root            filled circle inside a ring
     chord tone      filled rounded square
     scale tone      open circle, solid edge
     outside pent.   open circle, dashed edge
   Non-pentatonic notes are always open, so the dash is never hidden by a fill. */
const diagramMode = () => $('diagramMode').value;
const labelMode = () => $('labelMode').value;

/* Fill says "play this one now". Silhouette says what the note is — ringed
   circle for the root, square for a chord tone, plain circle for the rest.
   Edge says whether it survives into the pentatonic. Three channels, none of
   them colour, and they read independently. */
function markup(role, pent, played, x, y){
  /* Outside the pentatonic reads as a dashed edge when the note is hollow, and
     as a dashed ring just inside the fill when it is solid — a dashed edge on a
     filled dot scallops the silhouette and reads as a cog. */
  const cls = 'fb-mark' + (played ? ' filled' : '') + (!pent && !played ? ' dashed' : '');
  if(role === 'chord')
    return `<rect class="${cls}" x="${x-10}" y="${y-10}" width="20" height="20" rx="5.5"/>`;
  const ring = role === 'root' ? `<circle class="fb-ring" cx="${x}" cy="${y}" r="14"/>` : '';
  const inner = (!pent && played) ? `<circle class="fb-inner" cx="${x}" cy="${y}" r="8.4"/>` : '';
  return ring + `<circle class="${cls}" cx="${x}" cy="${y}" r="10.5"/>` + inner;
}

function legend(focus){
  const g = (role, pent, played, text) =>
    `<span><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">${markup(role, pent, played, 15, 15)}</svg>${text}</span>`;
  const nonPentPlayed = focus === 'scale';       /* during Full scale you do play the 4th and 7th */
  return '<div class="fb-legend">' + g('root', true, true, 'Root') + g('chord', true, true, 'Chord tone') +
         (focus === 'scale' ? '' : g('other', true, false, 'In the shape, not this exercise')) +
         g('other', false, nonPentPlayed, 'Not in the pentatonic') + '</div>';
}

function fretboard(shapeName, rootPc, keyName, focus){
  if(diagramMode() === 'off') return '';
  const rootsOnly = diagramMode() === 'roots';
  const {start, notes} = shapeNotes(shapeName, rootPc);
  const pad = 1, first = Math.max(0, start - pad), last = start + FRET_SPAN - 1 + pad;
  const cols = last - first + 1;
  const cw = 44, rh = 26, gx = 22, gy = 20;
  const W = gx + cols * cw + 10, H = gy + 5 * rh + 32;
  const x = f => gx + (f - first) * cw + cw / 2;
  const edge = f => gx + (f - first) * cw;
  const y = st => gy + st * rh;
  const flats = prefersFlats(keyName, 'major');
  const p = [];

  for(let st = 0; st < 6; st++)
    p.push(`<line class="fb-str" x1="${gx}" y1="${y(st)}" x2="${gx + cols * cw}" y2="${y(st)}"/>`);
  for(let f = first; f <= last + 1; f++)
    p.push(`<line class="${f === 0 ? 'fb-nut' : 'fb-fret'}" x1="${edge(f)}" y1="${y(0)}" x2="${edge(f)}" y2="${y(5)}"/>`);
  INLAYS.filter(f => f >= first && f <= last)
    .forEach(f => p.push(`<circle class="fb-inlay" cx="${x(f)}" cy="${(y(0) + y(5)) / 2}" r="3.5"/>`));
  STRING_NAME.forEach((n, st) => p.push(`<text class="fb-name" x="${gx - 8}" y="${y(st) + 3.5}">${n}</text>`));

  let drawn = 0;
  notes.forEach(n => {
    if(rootsOnly && n.role !== 'root') return;
    /* what this section actually asks them to play */
    const played = focus === 'scale' ? true
                 : focus === 'pent'  ? n.pent
                 : n.role !== 'other';
    drawn++;
    p.push(markup(n.role, n.pent, played, x(n.fret), y(n.st)));
    p.push(`<text class="fb-txt${played ? ' on' : ''}" x="${x(n.fret)}" y="${y(n.st)}">` +
      (labelMode() === 'note' ? noteName(n.pc, flats) : n.iv) + '</text>');
  });
  for(let f = first; f <= last; f++)
    p.push(`<text class="fb-num" x="${x(f)}" y="${y(5) + 22}">${f === 0 ? 'open' : f}</text>`);

  const desc = `${shapeName}, ${drawn} notes across frets ${start} to ${start + FRET_SPAN - 1}`;
  return `<svg class="fb" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${desc}">` +
    p.join('') + '</svg>' + (rootsOnly ? '' : legend(focus));
}

/* Every place a pitch class appears between the nut and the twelfth fret. */
function neckPositions(pc){
  const out = [];
  for(let st = 0; st < 6; st++){
    const first = ((pc - STRING_PC[st]) % 12 + 12) % 12;
    out.push({st, fret:first});
    if(first === 0) out.push({st, fret:12});
  }
  return out;
}

function neckboard(pc, keyName, revealed){
  const cw = 26, rh = 23, gx = 24, ow = 26, gy = 16;
  const nut = gx + ow, W = nut + 12 * cw + 10, H = gy + 5 * rh + 30;
  const y = st => gy + st * rh;
  const fx = f => f === 0 ? gx + ow / 2 : nut + (f - 1) * cw + cw / 2;
  const p = [];

  for(let st = 0; st < 6; st++)
    p.push(`<line class="fb-str" x1="${nut}" y1="${y(st)}" x2="${nut + 12 * cw}" y2="${y(st)}"/>`);
  p.push(`<line class="fb-nut" x1="${nut}" y1="${y(0)}" x2="${nut}" y2="${y(5)}"/>`);
  for(let f = 1; f <= 12; f++)
    p.push(`<line class="fb-fret" x1="${nut + f * cw}" y1="${y(0)}" x2="${nut + f * cw}" y2="${y(5)}"/>`);
  [3,5,7,9].forEach(f => p.push(`<circle class="fb-inlay" cx="${fx(f)}" cy="${(y(0)+y(5))/2}" r="3.5"/>`));
  [1.6, 3.4].forEach(k => p.push(`<circle class="fb-inlay" cx="${fx(12)}" cy="${y(0) + k * rh}" r="3.5"/>`));
  STRING_NAME.forEach((n, st) => p.push(`<text class="fb-name" x="${gx - 6}" y="${y(st) + 3.5}">${n}</text>`));
  [3,5,7,9,12].forEach(f => p.push(`<text class="fb-num" x="${fx(f)}" y="${y(5) + 21}">${f}</text>`));

  const spots = neckPositions(pc);
  if(revealed) spots.forEach(s => p.push(
    s.fret === 0 ? `<circle class="nb-open" cx="${fx(0)}" cy="${y(s.st)}" r="6.5"/>`
                 : `<circle class="nb-dot" cx="${fx(s.fret)}" cy="${y(s.st)}" r="7.5"/>`));

  const label = revealed ? `${spots.length} places, counting open strings` : 'Find them all first';
  return `<svg class="nb" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" ` +
    `aria-label="Guitar neck, nut to twelfth fret${revealed ? ', showing ' + spots.length + ' positions' : ', blank'}">` +
    p.join('') + '</svg>' +
    `<div class="nb-reveal"><button class="btn" onclick="toggleReveal()">${revealed ? 'Hide' : 'Show me'}</button>` +
    `<span class="nb-count">${label}</span></div>`;
}

let noteRevealed = false, revealKey = '';
function toggleReveal(){
  noteRevealed = !noteRevealed;
  trainPrompt(train.sectionIndex, train.itemIndex);
}

function paintBeatRail(beatInChord){
  const ticks = document.querySelectorAll('#beatRail .tick');
  ticks.forEach((tick, i) => {
    tick.classList.toggle('on', i < beatInChord);
    tick.classList.toggle('now', i === beatInChord - 1);
  });
}

/* ============================================================
   6. Session loop
   ============================================================ */
/* Every prompt is held for the same number of bars, so each chord in the
   rotation gets identical time. Sections are then rounded to a whole number of
   prompts — and to whole rotations where they're long enough — so nothing gets
   cut off mid-chord. The session length is snapped to match. */
function buildPlan(totalSeconds){
  const beat = 60 / bpm();
  const base = TRAIN_BLOCKS.reduce((sum, b) => sum + b[1], 0);
  let acc = 0;
  const sections = TRAIN_BLOCKS.map(b => {
    const beatsPerItem = b[2] * BEATS_PER_BAR;
    const itemSeconds = beatsPerItem * beat;
    const wanted = b[1] / base * totalSeconds;
    let items = Math.max(1, Math.round(wanted / itemSeconds));
    if(b[0] !== 'Note recall' && items >= ROTATION) items = Math.round(items / ROTATION) * ROTATION;
    const length = items * itemSeconds;
    acc += length;
    return {name:b[0], items, beatsPerItem, itemSeconds, length, end:acc};
  });
  return {sections, total:acc};
}

function elapsed(){
  if(!session.running) return 0;
  const paused = session.paused ? performance.now() - session.pauseStart : 0;
  return (performance.now() - session.startedAt - session.pausedFor - paused) / 1000 + session.skew;
}

function frame(){
  requestAnimationFrame(frame);

  /* If the OS suspended the audio clock — screen lock, a call, an app switch —
     pick up from now rather than firing every missed beat at once. */
  if(metro.on){
    if(Audio.suspended()) Audio.ensure();
    if(metro.nextBeat < Audio.now() - .4){
      metro.nextBeat = Audio.now() + .08;
      metro.beat = 0;
      metro.queue.length = 0;
      if(session.running){
        if(session.mode === 'perform') perform.pending = true;
        else { train.beatInItem = 0; train.force = true; }
      }
    }
  }

  /* drain scheduled beats at their audio time */
  const t = Audio.now();
  while(metro.queue.length && metro.queue[0].t <= t){
    const e = metro.queue.shift();
    const dot = $('beatDot');
    dot.className = 'dot beat' + (e.accent ? ' accent' : '');
    setTimeout(() => dot.className = 'dot', 90);
    if(e.event && e.event.kind === 'testbeat'){ testBeat(); renderTest(); continue; }
    if(!session.running) continue;
    if(session.mode === 'perform'){
      if(e.event) performPrompt();
      paintBeatRail(e.beatInChord);
    } else if(e.event){
      session.sectionIndex = e.event.section;
      trainPrompt(e.event.section, e.event.item);
      if(e.event.newSection) renderFlow();
    }
  }

  if(!session.running || session.paused) return;

  const el = elapsed();
  const left = Math.max(0, session.total - el);
  $('timer').textContent = clock(Math.ceil(left));
  $('railFill').style.width = Math.min(100, el / session.total * 100).toFixed(2) + '%';
  if(left <= 0) return finish();

  if(session.mode !== 'train' || !session.plan) return;
  const sec = session.plan.sections[train.sectionIndex];
  const done = (train.itemIndex * sec.beatsPerItem + train.beatInItem) * (60 / bpm());
  updateFlowFill(done, sec.length);
}

function start(){
  if(session.mode === 'test') return;
  Audio.ensure();
  stopSession(false);
  session.running = true; session.paused = false;
  session.startedAt = performance.now(); session.pausedFor = 0; session.skew = 0;
  session.sectionIndex = -1; session.itemIndex = -1;

  if(session.mode === 'perform'){
    session.total = clamp($('performMinutes').value, 1, 15, 5) * 60;
    perform.progression = rand(PROGRESSIONS);
    perform.degrees = progressionDegrees(perform.progression);
    perform.chordIndex = 0;
    perform.constraint = rand(CONSTRAINTS);
    perform.beatInChord = 0;
    perform.chord = null;
    perform.pending = true;                 // first beat fires chord 1
    performPrompt();
  } else {
    session.plan = buildPlan(clamp($('trainMinutes').value, 3, 20, 10) * 60);
    session.total = session.plan.total;
    train.sectionIndex = 0; train.itemIndex = 0; train.beatInItem = 0;
    train.newSection = false; train.force = false;
    session.sectionIndex = 0;
    trainPrompt(0, 0);
    renderFlow();
  }

  $('timer').textContent = clock(session.total);
  $('railFill').style.width = '0%';
  $('pauseBtn').disabled = false;
  $('stopBtn').disabled = false;
  $('skipBtn').disabled = session.mode !== 'train';
  startMetro();
  render();
  Wake.sync();
}

function pause(){
  if(!session.running || session.paused) return;
  session.paused = true; session.pauseStart = performance.now();
  stopMetro(); Audio.hush();
  $('prompt').classList.add('is-paused');
  $('pauseBtn').textContent = 'Resume';
  Wake.sync();
}
function resume(){
  if(!session.paused) return;
  Audio.ensure();
  session.pausedFor += performance.now() - session.pauseStart;
  session.paused = false;
  $('prompt').classList.remove('is-paused');
  $('pauseBtn').textContent = 'Pause';
  /* restart the count so the current prompt gets its full four bars */
  if(session.mode === 'perform') perform.pending = true;
  else { train.beatInItem = 0; train.force = true; }
  startMetro();
  Wake.sync();
}

/* Jump to the top of the next section. The section you skip is time you get back:
   the clock moves forward, so the session ends that much sooner. */
function skipSection(){
  if(!session.running || session.mode !== 'train' || !session.plan) return;
  const {sections} = session.plan;
  const s = train.sectionIndex;
  session.skew += (sections[s].end + .05) - elapsed();
  if(s < sections.length - 1){
    train.sectionIndex = s + 1;
    train.itemIndex = 0;
    train.beatInItem = 0;
    train.newSection = true;
    train.force = true;
  }
  if(session.paused) resume();
}

function stopSession(resetPrompt = true){
  session.running = false; session.paused = false;
  stopMetro(); Audio.hush();
  Wake.sync();
  metro.queue.length = 0;
  $('prompt').classList.remove('is-paused');
  $('pauseBtn').textContent = 'Pause';
  $('pauseBtn').disabled = true;
  $('stopBtn').disabled = true;
  $('skipBtn').disabled = true;
  if(resetPrompt) resetStage();
}

function finish(){
  session.running = false;
  stopMetro(); Audio.hush();
  Wake.sync();
  $('pauseBtn').disabled = true; $('stopBtn').disabled = true; $('skipBtn').disabled = true;
  $('constraintSlot').innerHTML = '';
  setPrompt({
    eyebrow:'Done',
    title:'Session complete',
    lede:'Log it to advance tomorrow’s position.',
    idle:true
  });
  renderFlow();
}

/* ============================================================
   7. Render
   ============================================================ */
function resetStage(){
  const isTrain = session.mode === 'train';
  if(isTrain){
    session.plan = buildPlan(clamp($('trainMinutes').value, 3, 20, 10) * 60);
    session.total = session.plan.total;
  } else {
    session.plan = null;
    session.total = clamp($('performMinutes').value, 1, 15, 5) * 60;
  }
  $('timer').textContent = clock(session.total);
  $('railFill').style.width = '0%';
  $('constraintSlot').innerHTML = '';
  session.sectionIndex = -1; session.itemIndex = -1;
  setPrompt({
    eyebrow:isTrain ? 'Train' : 'Perform',
    title:isTrain ? 'Ready when you are' : 'Ready to jam',
    lede:isTrain
      ? `Chords hold for four bars, root notes for eight, so each one in the rotation gets the same time. Runs to ${clock(session.total)} at ${bpm()} BPM.`
      : `A random progression built from the chords of ${key()} major — the key you have been practising. Four bars a chord, new constraint each change.`,
    idle:true
  });
  renderFlow();
}

function renderFlow(){
  $('flowTitle').textContent = session.mode === 'train' ? 'Session flow' : 'How perform works';
  const rows = session.plan
    ? session.plan.sections.map(sec => [sec.name, `${sec.items} × ${clock(sec.itemSeconds)}`])
    : TRAIN_BLOCKS.map(b => [b[0], `${b[2]} bars each`]);
  $('flowList').innerHTML = session.mode === 'train'
    ? rows.map((r, i) => {
        const state = session.running
          ? (i === session.sectionIndex ? ' is-active' : (i < session.sectionIndex ? ' is-done' : ''))
          : '';
        return `<div class="row${state}" data-section="${i}"><span>${r[0]}</span><span>${r[1]}</span><i class="row__fill"></i></div>`;
      }).join('')
    : [['Chords','From the practised key'],['Progression','Assigned at random'],['Each chord','4 bars · 16 beats'],['Constraint','New one per chord']]
        .map(r => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}
function updateFlowFill(sectionElapsed, sectionLength){
  const el = document.querySelector(`#flowList .row[data-section="${session.sectionIndex}"] .row__fill`);
  if(el) el.style.width = Math.min(100, sectionElapsed / sectionLength * 100) + '%';
}

function render(){
  const p = position();
  $('keyChip').textContent = 'Key ' + key();
  $('positionChip').textContent = p.name;
  $('bpmChip').textContent = bpm() + ' BPM';
  $('shapeHint').textContent = p.major.replace(' shape','') + ' / ' + p.minor.replace(' shape','') + ' shapes';

  const idx = Number($('positionSelect').value);
  $('rotationList').innerHTML = POSITIONS.map((pos, i) =>
    `<div class="row${i === idx ? ' is-active' : ''}"><span>${pos.name}</span><span>${pos.major.replace(' shape','')} / ${pos.minor.replace(' shape','')}</span></div>`
  ).join('');

  const nextPos = POSITIONS[(Number(store.get('cagedLastPosition', -1)) + 1) % POSITIONS.length].name;
  const days = streak();
  $('progressList').innerHTML = [
    ['Streak', days ? days + (days === 1 ? ' day' : ' days') : 'Not going'],
    ['This week', sessionsInLast(7) + ' of 7 days'],
    ['Sessions logged', store.get('cagedSessions', 0)],
    ['Last session', store.get('cagedLastSession', 'Not yet')],
    ['Up next', nextPos]
  ].map(r => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
  const fc = document.getElementById('fluencyCard');
  if(fc) fc.outerHTML = '<div id="fluencyCard">' + fluencyCard() + '</div>';
}

function setMode(next){
  if(session.mode === next) return;
  stopSession(false);
  if(tst.phase !== 'idle') closeTest();
  session.mode = next;
  ['train','perform','test'].forEach(m => document.body.classList.toggle('mode-' + m, next === m));
  ['trainTab','performTab','testTab'].forEach((id, i) =>
    $(id).setAttribute('aria-selected', ['train','perform','test'][i] === next));
  $('mainLayout').hidden = next === 'test';
  $('testPanel').hidden = next !== 'test';
  if(next === 'test'){ renderTest(); return; }
  $('startBtn').textContent = next === 'train' ? 'Start train' : 'Start perform';
  $('trainMinutesField').hidden = next !== 'train';
  $('performMinutesField').hidden = next === 'train';
  $('mixCard').hidden = next === 'train';
  $('skipBtn').hidden = next !== 'train';
  $('trainBpmField').hidden = next !== 'train';
  $('performBpmField').hidden = next === 'train';
  resetStage();
  render();
}


/* ==================================================================
   Skill test — 28 standalone tests across three levels
   ================================================================== */
const TEST_SKILLS = [
  {k:'chord', name:'Chord shapes', focus:'chord'},
  {k:'arp',   name:'Arpeggio',     focus:'chord'},
  {k:'scale', name:'Full scale',   focus:'scale'},
  {k:'pent',  name:'Pentatonic',   focus:'pent'},
  {k:'note',  name:'Note recall',  soon:true}
];
const LEVELS = [
  {n:1, diagram:'full',  perBeat:1, countdown:7, help:'Full diagram'},
  {n:2, diagram:'roots', perBeat:2, countdown:5, help:'Roots only'},
  {n:3, diagram:'off',   perBeat:3, countdown:3, help:'No diagram'}
];
const PASSES = 3;              // clean run-throughs required
const CHORD_BEATS = 4;         // one bar per chord, every level
const POS_NAMES = ['1st position','2nd position','3rd position','4th position','5th position'];

/* Level 2 progressions, chosen so the four of them span all ten shapes */
const L2_PROGRESSIONS = [
  {pos:'1st position', degrees:[1,4,5]},
  {pos:'1st position', degrees:[2,3,6]},
  {pos:'2nd position', degrees:[1,4,5]},
  {pos:'2nd position', degrees:[2,6,3]}
];
const TWELVE_BAR = [1,1,1,1,4,4,1,1,5,4,1,5];

const testId = (lvl, k, pos) => 'l' + lvl + '-' + k + (pos != null ? '-p' + (pos + 1) : '');
const passedTests = () => { try { return JSON.parse(store.get('cagedTests', '[]')); } catch(e){ return []; } };
const hasPassed = id => passedTests().indexOf(id) !== -1;
function markPassed(id){
  const all = passedTests();
  if(all.indexOf(id) === -1){ all.push(id); store.set('cagedTests', JSON.stringify(all)); }
}
/* every test that makes up a level */
function levelTests(lvl){
  const out = [];
  TEST_SKILLS.filter(s => !s.soon).forEach(s => {
    if(lvl === 3) POS_NAMES.forEach((_, i) => out.push({id:testId(3, s.k, i), skill:s, pos:i}));
    else out.push({id:testId(lvl, s.k), skill:s, pos:null});
  });
  return out;
}
const levelDone = lvl => levelTests(lvl).every(t => hasPassed(t.id));
const levelUnlocked = lvl => lvl === 1 || levelDone(lvl - 1);

/* ---- what a given test actually asks for ---- */
function buildTest(lvl, skillKey, posIndex){
  const L = LEVELS[lvl - 1], k = key();
  const skill = TEST_SKILLS.find(s => s.k === skillKey);
  const pos = posIndex != null ? posIndex : Math.floor(Math.random() * 5);
  const t = {level:L, skill, posIndex:pos, posName:POS_NAMES[pos], key:k, items:[], beatsPerItem:CHORD_BEATS};

  if(skillKey === 'chord'){
    if(lvl === 1){
      /* ten shapes in isolation, each on a randomly assigned root */
      t.items = Object.keys(SHAPES).map(name => {
        const rootPc = Math.floor(Math.random() * 12);
        return {shape:name, rootPc, label:noteName(rootPc, false) + (SHAPES[name].minor ? 'm' : ''), sub:name};
      }).sort(() => Math.random() - .5);
      t.blurb = 'Ten shapes, one bar each. The root moves every time.';
    } else if(lvl === 2){
      L2_PROGRESSIONS.forEach(pr => pr.degrees.forEach(d => {
        const shape = shapeNameFor(pr.pos, d), rootPc = degreeRootPc(k, d);
        t.items.push({shape, rootPc, label:chordName(k, 'major', d), sub:shapeLabel(shape), group:pr.pos});
      }));
      t.blurb = 'Four three-chord progressions. Between them they use all ten shapes.';
    } else {
      TWELVE_BAR.forEach(d => {
        const shape = shapeNameFor(t.posName, d), rootPc = degreeRootPc(k, d);
        t.items.push({shape, rootPc, label:chordName(k, 'major', d), sub:shapeLabel(shape)});
      });
      t.blurb = 'Twelve bars in the ' + t.posName + '. One chord per bar throughout.';
    }
    t.totalBeats = t.items.length * CHORD_BEATS;
  } else {
    /* one shape, played up and down, PASSES times */
    const degree = 1 + Math.floor(Math.random() * 6);
    const shape = shapeNameFor(t.posName, degree), rootPc = degreeRootPc(k, degree);
    const notes = shapeNotes(shape, rootPc).notes.filter(n =>
      skill.focus === 'scale' ? true : skill.focus === 'pent' ? n.pent : n.role !== 'other');
    t.shape = shape; t.rootPc = rootPc; t.degree = degree;
    t.noteCount = notes.length;
    t.notesPerPass = 2 * notes.length - 1;          /* up and down, top note not repeated */
    t.totalBeats = Math.ceil(t.notesPerPass * PASSES / L.perBeat);
    t.beatsPerPass = t.notesPerPass / L.perBeat;
    t.blurb = t.notesPerPass + ' notes up and down, ' + PASSES + ' times, ' +
              L.perBeat + ' note' + (L.perBeat > 1 ? 's' : '') + ' per beat.';
  }
  return t;
}

/* ---- runner state ---- */
const tst = {t:null, phase:'idle', beat:0, item:0, results:[], id:null, countdown:0};

function openTest(lvl, skillKey, posIndex){
  const skill = TEST_SKILLS.find(s => s.k === skillKey);
  if(skill.soon) return;
  if(!levelUnlocked(lvl)) return;
  tst.id = testId(lvl, skillKey, posIndex);
  tst.t = buildTest(lvl, skillKey, posIndex);
  tst.phase = 'brief'; tst.beat = 0; tst.item = 0; tst.results = [];
  renderTest();
}
function closeTest(){ stopMetro(); tst.phase = 'idle'; tst.t = null; Wake.sync(); renderTest(); }

function beginTest(){
  Audio.ensure();
  tst.phase = 'countdown';
  tst.countdown = tst.t.level.countdown;
  renderTest();
  const tick = () => {
    tst.countdown--;
    if(tst.countdown <= 0){
      clearInterval(h);
      tst.phase = 'running'; tst.beat = 0; tst.item = 0;
      startMetro();
    }
    renderTest();
  };
  const h = setInterval(tick, 1000);
}

function testBeat(){                    /* called once per scheduled beat */
  const t = tst.t;
  tst.beat++;
  if(t.skill.k === 'chord') tst.item = Math.floor(tst.beat / CHORD_BEATS);
  if(tst.beat >= t.totalBeats){
    stopMetro();
    tst.phase = 'rating';
    tst.results = t.skill.k === 'chord' && t.level.n === 1
      ? t.items.map(() => true)         /* per-shape marking at level 1 */
      : [true];
  }
}

function markResult(i){
  tst.results[i] = !tst.results[i];
  renderTest();
}
function finishTest(){
  const passed = tst.results.every(Boolean);
  if(passed) markPassed(tst.id);
  tst.phase = 'done'; tst.passed = passed;
  renderTest(); render();
}

/* ---- rendering ---- */
function testDiagram(){
  const t = tst.t, mode = t.level.diagram;
  const reveal = tst.phase === 'rating' || tst.phase === 'done';
  const show = reveal ? 'full' : mode;
  const prev = $('diagramMode').value;
  $('diagramMode').value = show === 'off' ? 'off' : show;
  let html = '';
  if(t.skill.k === 'chord'){
    const it = t.items[Math.min(tst.item, t.items.length - 1)];
    html = show === 'off' && !reveal ? '' : fretboard(it.shape, it.rootPc, t.key, 'chord');
  } else {
    html = show === 'off' && !reveal ? '' : fretboard(t.shape, t.rootPc, t.key, t.skill.focus);
  }
  $('diagramMode').value = prev;
  return html;
}

function renderTest(){
  const host = $('testPanel');
  if(!host) return;
  if(tst.phase === 'idle'){ host.innerHTML = testGrid(); return; }
  const t = tst.t;
  const head = `<div class="tt-head"><div><div class="tt-eyebrow">Level ${t.level.n} · ${t.level.help}</div>
      <h2>${t.skill.name}</h2><div class="tt-sub">${t.key} · ${t.posName}${t.shape ? ' · ' + shapeLabel(t.shape) : ''}</div></div>
    <button class="btn btn--quiet" onclick="closeTest()">Close</button></div>`;

  if(tst.phase === 'brief'){
    host.innerHTML = `<section class="card tt">${head}
      <div class="tt-body">
        <p class="tt-blurb">${t.blurb}</p>
        <dl class="details">
          <div class="detail"><dt>Tempo</dt><dd>60 BPM</dd></div>
          <div class="detail"><dt>Diagram</dt><dd>${t.level.help}</dd></div>
          <div class="detail"><dt>Length</dt><dd>${clock(t.totalBeats)}</dd></div>
          <div class="detail"><dt>Mistakes allowed</dt><dd>None</dd></div>
        </dl>
        ${testDiagram()}
      </div>
      <div class="tt-foot"><span class="tt-note">Counts in from ${t.level.countdown}</span>
        <button class="btn btn--primary" onclick="beginTest()">I'm ready</button></div></section>`;
    return;
  }
  if(tst.phase === 'countdown'){
    host.innerHTML = `<section class="card tt">${head}
      <div class="tt-body tt-centre"><div class="tt-count">${tst.countdown}</div>
      <p class="tt-blurb">${t.blurb}</p></div></section>`;
    return;
  }
  if(tst.phase === 'running'){
    const t2 = tst.t, left = t2.totalBeats - tst.beat;
    const now = t2.skill.k === 'chord'
      ? `<div class="tt-now">${t2.items[Math.min(tst.item, t2.items.length-1)].label}</div>
         <div class="tt-nowsub">${t2.items[Math.min(tst.item, t2.items.length-1)].sub}</div>`
      : `<div class="tt-now">Pass ${Math.min(PASSES, Math.floor(tst.beat / t2.beatsPerPass) + 1)} of ${PASSES}</div>
         <div class="tt-nowsub">${t2.level.perBeat} note${t2.level.perBeat>1?'s':''} per beat</div>`;
    host.innerHTML = `<section class="card tt">${head}
      <div class="rail"><div class="rail__fill" style="width:${(tst.beat/t2.totalBeats*100).toFixed(1)}%"></div></div>
      <div class="tt-body tt-centre">${now}
        <div class="tt-clock">${clock(left)}</div>
        ${testDiagram()}</div>
      <div class="tt-foot"><span class="tt-note">Stop if you make a mistake — it has to be clean</span>
        <button class="btn" onclick="closeTest()">Abandon</button></div></section>`;
    return;
  }
  if(tst.phase === 'rating'){
    const perShape = t.skill.k === 'chord' && t.level.n === 1;
    const body = perShape
      ? `<p class="tt-blurb">Mark any you did not get cleanly in the bar.</p>
         <div class="tt-marks">${t.items.map((it,i)=>
           `<button class="tt-mark ${tst.results[i]?'ok':'no'}" onclick="markResult(${i})">
              <b>${it.label}</b><span>${it.sub}</span></button>`).join('')}</div>`
      : `<p class="tt-blurb">Three clean passes, no mistakes?</p>
         <div class="tt-yesno">
           <button class="btn ${tst.results[0]?'btn--primary':''}" onclick="tst.results[0]=true;renderTest()">Clean</button>
           <button class="btn ${!tst.results[0]?'btn--primary':''}" onclick="tst.results[0]=false;renderTest()">Not clean</button>
         </div>`;
    host.innerHTML = `<section class="card tt">${head}
      <div class="tt-body">${body}${testDiagram()}</div>
      <div class="tt-foot"><span class="tt-note">The app times you; only you can hear whether it was clean</span>
        <button class="btn btn--primary" onclick="finishTest()">Submit</button></div></section>`;
    return;
  }
  host.innerHTML = `<section class="card tt">${head}
    <div class="tt-body tt-centre">
      <div class="tt-result ${tst.passed?'pass':'fail'}">${tst.passed ? 'Passed' : 'Not this time'}</div>
      <p class="tt-blurb">${tst.passed
        ? (levelDone(t.level.n) && t.level.n < 3 ? 'That completes level ' + t.level.n + '. Level ' + (t.level.n+1) + ' is unlocked.' : 'Logged.')
        : 'Nothing recorded. Take it again whenever you like.'}</p>
    </div>
    <div class="tt-foot"><span></span><button class="btn btn--primary" onclick="closeTest()">Back to tests</button></div></section>`;
}

function testGrid(){
  return LEVELS.map(L => {
    const unlocked = levelUnlocked(L.n), done = levelDone(L.n);
    const tests = levelTests(L.n);
    const passedN = tests.filter(t => hasPassed(t.id)).length;
    return `<section class="card tt-level ${unlocked?'':'locked'}">
      <header>
        <div><h3>Level ${L.n} <span class="tt-help">${L.help} · ${L.perBeat} note${L.perBeat>1?'s':''} per beat</span></h3></div>
        <span class="tt-score">${done ? 'Complete' : unlocked ? passedN + ' of ' + tests.length : 'Locked'}</span>
      </header>
      ${unlocked ? '' : '<p class="tt-locked">Clear every test in level ' + (L.n-1) + ' first.</p>'}
      <div class="tt-cells">
        ${TEST_SKILLS.map(s => {
          if(s.soon) return `<div class="tt-cell soon"><b>${s.name}</b><span>Coming soon</span></div>`;
          if(L.n < 3){
            const id = testId(L.n, s.k), ok = hasPassed(id);
            return `<button class="tt-cell ${ok?'ok':''}" ${unlocked?'':'disabled'}
              onclick="openTest(${L.n},'${s.k}')"><b>${s.name}</b>
              <span>${ok ? 'Passed' : 'Not yet'}</span></button>`;
          }
          const n = POS_NAMES.filter((_,i)=>hasPassed(testId(3,s.k,i))).length;
          return `<div class="tt-cell ${n===5?'ok':''}"><b>${s.name}</b>
            <span>${n} of 5 positions</span>
            <span class="tt-pos">${POS_NAMES.map((p,i)=>
              `<button class="${hasPassed(testId(3,s.k,i))?'ok':''}" ${unlocked?'':'disabled'}
                 onclick="openTest(3,'${s.k}',${i})" title="${p}">${i+1}</button>`).join('')}</span></div>`;
        }).join('')}
      </div></section>`;
  }).join('');
}

/* ==================================================================
   Practice motivation — onboarding, fluency check-ins, progress
   ================================================================== */
const SKILLS = [
  ['note',  'Note recall'],
  ['chord', 'Chord shape'],
  ['arp',   'Arpeggio'],
  ['scale', 'Full scale'],
  ['pent',  'Pentatonic']
];
const FLUENCY_EVERY = 3;      // sessions between check-ins
const HIATUS_DAYS = 4;        // gap that re-surfaces the anchoring statement
const ANCHOR_EXAMPLES = ['after dinner each evening', 'before work each morning',
                         'once the kids are in bed', 'straight after the school run'];
const ANCHORS = [
  'Hunting for every note, losing the beat',
  'Found them, but kept looking at the diagram',
  'Got through it without the diagram, a few stumbles',
  'Smooth at tempo, the odd hesitation',
  "Didn't have to think about it"
];

const today = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const readJSON = (k, d) => { try { return JSON.parse(store.get(k, JSON.stringify(d))); } catch(e){ return d; } };

/* ---- session log, streak, consistency ---- */
function logSession(){
  const log = readJSON('cagedLog', []);
  if(log[log.length - 1] !== today()) log.push(today());
  store.set('cagedLog', JSON.stringify(log));
  return log;
}
function streak(){
  const log = readJSON('cagedLog', []);
  if(!log.length) return 0;
  const last = log[log.length - 1];
  if(daysBetween(last, today()) > 1) return 0;      /* broken unless today or yesterday */
  let n = 1;
  for(let i = log.length - 1; i > 0; i--){
    if(daysBetween(log[i - 1], log[i]) === 1) n++; else break;
  }
  return n;
}
const sessionsInLast = days =>
  readJSON('cagedLog', []).filter(d => daysBetween(d, today()) < days).length;

/* ---- sheets ---- */
function sheet(title, body, foot){
  document.body.insertAdjacentHTML('beforeend',
    '<div class="fbwrap" id="mvwrap"><div class="fbsheet">' +
    '<div class="fbhead"><b>' + title + '</b>' +
    '<button class="fbx" onclick="closeSheet()">&times;</button></div>' +
    '<div class="fbbody">' + body + '</div>' +
    '<div class="fbfoot">' + foot + '</div></div></div>');
}
function closeSheet(){ const w = document.getElementById('mvwrap'); if(w) w.remove(); }

/* ---- 21. onboarding and the anchoring statement ---- */
function openOnboarding(first){
  sheet(first ? 'Before you start' : 'Your practice plan',
    (first ? '<p class="mv-lede">Two questions. People who write these down practise more than people who mean to.</p>' : '') +
    '<label class="fblab" for="mvWhy">Why do you want to practise?</label>' +
    '<textarea id="mvWhy" rows="3" placeholder="To stop getting stuck in the same box">' + store.get('cagedWhy', '') + '</textarea>' +
    '<label class="fblab" for="mvAnchor">I will practise the guitar\u2026</label>' +
    '<input id="mvAnchor" placeholder="after dinner each evening" value="' + store.get('cagedAnchor', '') + '">' +
    '<div class="mv-chips">' + ANCHOR_EXAMPLES.map(x =>
      '<button onclick="document.getElementById(\'mvAnchor\').value=\'' + x + '\'">' + x + '</button>').join('') + '</div>' +
    '<p class="mv-note">Tie it to something that already happens \u2014 dinner, the commute, the kids going up. ' +
    '"In the evenings" has nothing to fire it.</p>',
    (first ? '<button class="fbbtn ghost" onclick="skipOnboarding()">Not now</button>' : '') +
    '<span style="flex:1"></span><button class="fbbtn" onclick="saveOnboarding()">Save</button>');
}
function saveOnboarding(){
  store.set('cagedWhy', document.getElementById('mvWhy').value.trim());
  store.set('cagedAnchor', document.getElementById('mvAnchor').value.trim());
  store.set('cagedAnchorSeen', today());
  closeSheet(); render();
}
function skipOnboarding(){ store.set('cagedOnboardSkipped', today()); closeSheet(); }

/* Surfaced by circumstance, not by calendar — a statement shown every Monday
   becomes wallpaper by week three. */
function maybeRemind(){
  const anchor = store.get('cagedAnchor', '');
  if(!anchor) return;
  const log = readJSON('cagedLog', []);
  if(!log.length) return;
  const gap = daysBetween(log[log.length - 1], today());
  const shown = store.get('cagedAnchorSeen', '');
  if(gap < HIATUS_DAYS) return;
  if(shown && daysBetween(shown, today()) < HIATUS_DAYS) return;
  store.set('cagedAnchorSeen', today());
  sheet('Welcome back',
    '<p class="mv-lede">It has been ' + gap + ' days. You said you would practise:</p>' +
    '<blockquote class="mv-quote">' + anchor + '</blockquote>' +
    (store.get('cagedWhy', '') ? '<p class="mv-note">Because: ' + store.get('cagedWhy', '') + '</p>' : '') +
    '<p class="mv-note">If that slot stopped working, change it rather than pushing through.</p>',
    '<button class="fbbtn ghost" onclick="closeSheet();openOnboarding(false)">Change it</button>' +
    '<span style="flex:1"></span><button class="fbbtn" onclick="closeSheet()">Still works</button>');
}

/* ---- 22. fluency check-in ---- */
function openCheckIn(){
  sheet('How did that feel?',
    '<p class="mv-lede">Rate the skill, not the position. Same five every time, so the trend means something.</p>' +
    '<ol class="mv-anchors">' + ANCHORS.map(a => '<li>' + a + '</li>').join('') + '</ol>' +
    SKILLS.map(([k, label]) =>
      '<div class="mv-row"><span>' + label + '</span><span class="mv-scale" id="mv-' + k + '">' +
      [1,2,3,4,5].map(n => '<button onclick="pickScore(\'' + k + '\',' + n + ')">' + n + '</button>').join('') +
      '</span></div>').join(''),
    '<button class="fbbtn ghost" onclick="closeSheet()">Skip</button>' +
    '<span style="flex:1"></span><button class="fbbtn" onclick="saveCheckIn()">Save</button>');
}
let scores = {};
function pickScore(k, n){
  scores[k] = n;
  document.querySelectorAll('#mv-' + k + ' button')
    .forEach((b, i) => b.classList.toggle('on', i + 1 === n));
}
function saveCheckIn(){
  if(!Object.keys(scores).length){ closeSheet(); return; }
  const all = readJSON('cagedFluency', []);
  all.push({d: today(), n: Number(store.get('cagedSessions', 0)), r: scores});
  store.set('cagedFluency', JSON.stringify(all));
  scores = {};
  closeSheet(); render();
}

/* ---- 23. progress ---- */
function spark(values){
  if(values.length < 2) return '<span class="mv-nodata">\u2014</span>';
  const w = 84, h = 20, step = w / (values.length - 1);
  const pts = values.map((v, i) => (i * step).toFixed(1) + ',' + (h - ((v - 1) / 4) * (h - 4) - 2).toFixed(1)).join(' ');
  return '<svg class="mv-spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
         '<polyline points="' + pts + '"/></svg>';
}
function fluencyCard(){
  const all = readJSON('cagedFluency', []);
  if(all.length < 2) return '';
  return '<section class="card"><h3 class="card__title">How it is feeling</h3><div class="list">' +
    SKILLS.map(([k, label]) => {
      const vals = all.map(e => e.r[k]).filter(v => v);
      const last = vals[vals.length - 1];
      return '<div class="row"><span>' + label + '</span>' +
             '<span class="mv-trend">' + spark(vals.slice(-8)) +
             '<b>' + (last || '\u2013') + '</b></span></div>';
    }).join('') +
    '</div><p class="mv-foot">Confidence, not skill. Rotating positions feels worse and works better.</p></section>';
}

}
['diagramMode','labelMode'].forEach(id => $(id).addEventListener('change', () => {
  syncDiagramUI();

  session.mode === 'perform' ? performPrompt() : trainPrompt(train.sectionIndex, train.itemIndex);
}));
syncDiagramUI();

['keySelect','positionSelect','bpmInput','trainBpm'].forEach(id => $(id).addEventListener('change', render));
['trainMinutes','performMinutes','trainBpm','keySelect'].forEach(id =>
  $(id).addEventListener('change', () => { if(!session.running) resetStage(); }));

document.addEventListener('keydown', e => {
  if(e.target.matches('input,select,textarea')) return;
  if(e.code === 'Space'){
    e.preventDefault();
    session.running ? (session.paused ? resume() : pause()) : start();
  }
  if((e.key || '').toLowerCase() === 'm'){ metro.on ? stopMetro() : startMetro(); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); skipSection(); }
});

resetStage();

requestAnimationFrame(frame);


/* ==================================================================
   Feedback
   ================================================================== */
/* What the trainer reports about where the tester was. Reads live session
   state so a bug report says which section and which prompt, not "the app". */
function FB_CONTEXT(){
  const m = session.mode;
  let where;
  if(!session.running){
    where = (m === 'train' ? 'Train' : 'Perform') + ' \u2014 not started';
  } else if(m === 'train'){
    const sec = session.plan ? session.plan.sections[train.sectionIndex] : null;
    where = 'Train \u2014 ' + (sec ? sec.name : '?') + ' \u2014 prompt ' + (train.itemIndex + 1) +
            ' of ' + (sec ? sec.items : '?') + ' \u2014 "' + $('title').textContent + '"';
  } else {
    where = 'Perform \u2014 ' + (perform.progression ? perform.progression.name : '?') +
            ' \u2014 chord "' + $('title').textContent + '" \u2014 constraint "' + perform.constraint + '"';
  }
  return {
    where,
    settings: 'key=' + key() + ' ' + position().name + ' ' + bpm() + 'bpm' +
              ' fretboard=' + $('diagramMode').value + ' labels=' + $('labelMode').value +
              (session.paused ? ' PAUSED' : '')
  };
}

/* ==================================================================
   Feedback widget. Captures where the tester was, not just what they
   said — screen, week, day, step, settings, device — so nobody has to
   write "on the page with the diagram, I think it was day 2?"
   ================================================================== */
/* Paste the Apps Script /exec URL here and submissions go straight to your
   Sheet. Leave it empty and Send falls back to opening the tester's mail app. */
const FEEDBACK_URL = 'https://script.google.com/macros/s/AKfycbyYw0G3YUMXyoYpJn-xSD1wuUnoTLXJnE0kSL7vetKzAmGW2jZrlTyWZkg_SNrAz6gR/exec';
const FEEDBACK_TO  = 'you@example.com';

const FB = (() => {
  const KEY = 'cagedFeedback', WHO = 'cagedTester';
  const load = () => { try { return JSON.parse(store.get(KEY, '[]')); } catch(e){ return []; } };
  const save = list => store.set(KEY, JSON.stringify(list));
  let draft = {type:'bug', severity:'annoying'};

  /* The host page supplies FB_CONTEXT() — that is the only part that differs
     between the trainer and the learn module. Everything else is identical. */
  function context(){
    const c = FB_CONTEXT();
    c.device = screen.width + 'x' + screen.height + ' vw' + window.innerWidth + ' ' +
               (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    return c;
  }

  const block = f => ['--- CAGED FEEDBACK ---','id: '+f.id,'tester: '+f.tester,'when: '+f.when,
    'type: '+f.type,'severity: '+(f.type==='bug'?f.severity:'-'),'where: '+f.where,
    'settings: '+f.settings,'device: '+f.device,'text: '+f.text.replace(/\n+/g,' / '),'--- END ---'].join('\n');

  function open(){
    seen();
    const c = context();
    document.body.insertAdjacentHTML('beforeend',
      '<div class="fbwrap" id="fbwrap"><div class="fbsheet">' +
      '<div class="fbhead"><b>Feedback</b><button class="fbx" onclick="FB.close()">&times;</button></div>' +
      '<div class="fbbody">' +
      '<label class="fblab">What kind?</label><div class="fbchips" id="fbType">' +
      [['bug','Something broke'],['confusing','Confusing'],['idea','Idea'],['praise','This worked']]
        .map(x => '<button data-v="'+x[0]+'" class="'+(x[0]===draft.type?'on':'')+'" onclick="FB.pick(\'type\',\''+x[0]+'\')">'+x[1]+'</button>').join('') +
      '</div><div id="fbSevWrap"' + (draft.type!=='bug'?' hidden':'') + '>' +
      '<label class="fblab">How bad?</label><div class="fbchips" id="fbSev">' +
      [['blocking','Stopped me'],['annoying','Annoying'],['minor','Minor']]
        .map(x => '<button data-v="'+x[0]+'" class="'+(x[0]===draft.severity?'on':'')+'" onclick="FB.pick(\'severity\',\''+x[0]+'\')">'+x[1]+'</button>').join('') +
      '</div></div>' +
      '<label class="fblab" for="fbText">In your own words</label>' +
      '<textarea id="fbText" rows="5" placeholder="What happened, or what would be better?"></textarea>' +
      '<label class="fblab" for="fbWho">Your name</label>' +
      '<input id="fbWho" value="' + store.get(WHO,'') + '" placeholder="So we know who to ask">' +
      '<div class="fbctx"><b>Where you are right now</b>' + c.where + ' &middot; ' + c.settings + ' &middot; ' + c.device +
      '<span class="fbnote">Attached automatically. Telling us about something from earlier? Just say so in your note and we will match it up.</span></div>' +
      '</div><div class="fbfoot"><button class="fbbtn ghost" onclick="FB.history()">History</button>' +
      '<span style="flex:1"></span><button class="fbbtn ghost" onclick="FB.submit(\'copy\')">Copy</button>' +
      '<button class="fbbtn" onclick="FB.submit(\'mail\')">Send</button></div></div></div>');
    setTimeout(() => document.getElementById('fbText').focus(), 60);
  }

  function pick(k, v){
    draft[k] = v;
    document.querySelectorAll('#fb' + (k==='type'?'Type':'Sev') + ' button')
      .forEach(b => b.classList.toggle('on', b.dataset.v === v));
    if(k === 'type') document.getElementById('fbSevWrap').hidden = v !== 'bug';
  }

  function submit(how){
    const text = document.getElementById('fbText').value.trim();
    if(!text){ document.getElementById('fbText').focus(); return; }
    const tester = document.getElementById('fbWho').value.trim() || 'anon';
    store.set(WHO, tester);
    const f = Object.assign({id:'fb-'+Date.now().toString(36), tester,
      when:new Date().toISOString().slice(0,16).replace('T',' '),
      type:draft.type, severity:draft.severity, text}, context());
    const list = load(); list.push(f); save(list);   /* always keep a local copy */

    if(how === 'copy'){
      if(navigator.clipboard) navigator.clipboard.writeText(block(f));
      close(); toast('Copied \u2014 paste it wherever suits'); return;
    }
    if(FEEDBACK_URL){
      /* text/plain keeps this a simple request, so the browser skips the CORS
         preflight that Apps Script will not answer. The reply is opaque, which
         is fine — the local copy is the safety net if it ever fails. */
      fetch(FEEDBACK_URL, {method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(f)}).catch(function(){});
      close(); toast('Thanks \u2014 sent');
    } else {
      location.href = 'mailto:' + FEEDBACK_TO + '?subject=' +
        encodeURIComponent('CAGED feedback from ' + tester) + '&body=' + encodeURIComponent(block(f));
      close(); toast('Opening your mail app');
    }
  }

  function history(){
    const list = load();
    document.querySelector('.fbsheet').innerHTML =
      '<div class="fbhead"><b>Your feedback &middot; ' + list.length + '</b>' +
      '<button class="fbx" onclick="FB.close()">&times;</button></div><div class="fbbody">' +
      (list.length ? list.slice().reverse().map(f =>
        '<div class="fbitem"><div class="fbmeta">' + f.when + ' &middot; ' + f.type +
        (f.type==='bug' ? ' &middot; '+f.severity : '') + '</div><div class="fbwhere">' + f.where +
        '</div><div>' + f.text + '</div></div>').join('')
        : '<p style="color:var(--ink-2);font-size:14px">Nothing yet.</p>') +
      '</div><div class="fbfoot"><button class="fbbtn ghost" onclick="FB.open2()">New</button>' +
      '<span style="flex:1"></span><button class="fbbtn" onclick="FB.exportAll()">Copy all ' + list.length + '</button></div>';
  }

  function exportAll(){
    const all = load().map(block).join('\n\n');
    if(navigator.clipboard) navigator.clipboard.writeText(all);
    close(); toast('All feedback copied');
  }

  function toast(msg){
    document.body.insertAdjacentHTML('beforeend', '<div class="fbtoast">' + msg + '</div>');
    const t = document.querySelector('.fbtoast');
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2200);
  }
  function hint(){
    if(store.get('cagedFbSeen','')) return;
    document.body.insertAdjacentHTML('beforeend',
      '<div class="fbhint" id="fbhint">Hit a snag, or something unclear? Tap <b>Feedback</b>. ' +
      'It records which screen you were on, so tap it there and then rather than saving things up.' +
      '<button onclick="FB.seen()">Got it</button></div>');
  }
  function seen(){
    store.set('cagedFbSeen','1');
    const h = document.getElementById('fbhint');
    if(h){ h.style.opacity='0'; setTimeout(function(){ h.remove(); }, 250); }
  }
  const close = () => { const w = document.getElementById('fbwrap'); if(w) w.remove(); };
  const open2 = () => { close(); open(); };

  return {open, open2, close, pick, submit, history, exportAll, hint, seen};
})();

document.body.insertAdjacentHTML('beforeend',
  '<button class="fbfab" onclick="FB.open()" aria-label="Give feedback">Feedback</button>');
document.body.insertAdjacentHTML('beforeend',
  '<button class="fbfab" onclick="FB.open()" aria-label="Give feedback">Feedback</button>');
FB.hint();

if(!store.get('cagedAnchor','') && !store.get('cagedOnboardSkipped','') && !Number(store.get('cagedSessions', 0)))
  setTimeout(() => openOnboarding(true), 600);
else
  setTimeout(maybeRemind, 600);

document.body.insertAdjacentHTML('beforeend',
  '<button class="fbfab" onclick="FB.open()" aria-label="Give feedback">Feedback</button>');

</script>
